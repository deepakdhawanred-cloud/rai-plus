<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Psychometric Assessment Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,650&display=swap" rel="stylesheet">
<style>
/* Layout idea: a quiet testing-room page — one column, test content centred in a single card, results as a clinical report */
:root{
  --bg:#f2f3ef;--surface:#ffffff;--ink:#18212b;--muted:#5b6571;--line:#d8dcd4;
  --accent:#1d5b86;--accent-soft:#e2ecf3;--mark:#b0731a;
  --good:#2e7a4d;--warn:#a66a12;--bad:#b23b3b;
  --display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161a;--surface:#1a2026;--ink:#e6e9e5;--muted:#9aa4ae;--line:#2c353d;
  --accent:#7db2d8;--accent-soft:#1c2c38;--mark:#e0a447;--good:#6cc08f;--warn:#e0a447;--bad:#ec8080;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#11161a;--surface:#1a2026;--ink:#e6e9e5;--muted:#9aa4ae;--line:#2c353d;
  --accent:#7db2d8;--accent-soft:#1c2c38;--mark:#e0a447;--good:#6cc08f;--warn:#e0a447;--bad:#ec8080;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
h1,h2,h3{font-family:var(--display);font-weight:650;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:1.65rem}h2{font-size:1.35rem}h3{font-size:1.08rem}
p{margin:0}
a{color:var(--accent)}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line);background:var(--surface)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 0}
.brand{display:flex;flex-direction:column}
.brand small{color:var(--muted);font-size:.8rem}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 14px;border-radius:6px;font:500 .95rem var(--body);color:var(--muted);cursor:pointer}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
main{padding:28px 0 64px}
.stack{display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;font-weight:500}
input,select{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.check{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400}
.check input{margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 .95rem var(--body);padding:10px 18px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.facts{display:flex;gap:18px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}
.err{color:var(--bad);font-size:.88rem}
/* test runner */
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.likert-row{display:grid;grid-template-columns:minmax(200px,1.3fr) 2fr;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.likert-row.missing .stmt{color:var(--bad)}
.likert-row .stmt{font-weight:500}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{font:500 .74rem/1.2 var(--body);padding:8px 4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;cursor:pointer;min-height:44px}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
@media (max-width:640px){.likert-row{grid-template-columns:1fr}.scale button{font-size:.68rem}}
.timer{font:600 1.1rem var(--body);font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.timer.low{background:var(--bad);color:var(--surface)}
.qtext{font-size:1.15rem;font-weight:500}
.series{font:600 1.6rem var(--display);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.matrix{display:grid;grid-template-columns:repeat(3,96px);gap:0;border:2px solid var(--ink);width:max-content;margin:0 auto}
.matrix div{width:96px;height:96px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.matrix .q{font:650 2rem var(--display);color:var(--mark)}
.opts{display:grid;gap:10px}
.opts.fig{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.opts.txt{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.opt{position:relative;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;cursor:pointer;padding:10px;font:500 1rem var(--body);display:grid;place-items:center;min-height:52px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .lbl{position:absolute;top:4px;left:7px;font-size:.72rem;color:var(--muted);font-weight:600}
.opt svg{width:80px;height:80px}
.target svg{width:120px;height:120px}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.palette button{font:600 .75rem var(--body);height:32px;border-radius:5px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.palette button.done{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
.palette button.cur{outline:2px solid var(--accent)}
/* report */
.score-hero{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end}
.big{font:650 3.4rem/1 var(--display);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font:600 .78rem var(--body);padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.trait{display:grid;grid-template-columns:190px 1fr 56px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.trait .desc{grid-column:2/4;font-size:.88rem;color:var(--muted)}
@media (max-width:640px){.trait{grid-template-columns:1fr 50px}.trait .desc{grid-column:1/3}.trait .track{grid-column:1/2}}
.track{position:relative;height:12px;border-radius:6px;background:var(--line)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--accent)}
.track .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.5}
.num{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.ci{position:relative;height:30px;margin-top:8px}
.ci .axis{position:absolute;left:0;right:0;top:14px;height:2px;background:var(--line)}
.ci .band{position:absolute;top:8px;height:14px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:4px}
.ci .pt{position:absolute;top:5px;width:4px;height:20px;background:var(--accent);margin-left:-2px;border-radius:2px}
.ci-labels{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.tablebox{overflow-x:auto}
.note{border-left:3px solid var(--mark);padding:10px 14px;background:color-mix(in srgb,var(--mark) 9%,transparent);border-radius:0 6px 6px 0;font-size:.92rem}
.prose{max-width:68ch;display:flex;flex-direction:column;gap:12px}
.prose ul,.prose ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.refs li{font-size:.86rem}
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;padding:20px;z-index:10}
.modal .card{max-width:440px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:20}
.feature{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.subgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.subitem{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:.88rem}
.subitem .num{min-width:22px;text-align:center;border-radius:50%;background:var(--line);font-size:.78rem;line-height:22px}
.subitem.done .num{background:var(--good);color:var(--surface)}
.subitem.next{border-color:var(--accent);background:var(--accent-soft)}
.opts.one{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.bdwrap{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start}
.bdgrid{display:grid;gap:0;border:2px solid var(--ink);width:max-content}
.bdgrid svg{display:block}
.bdgrid.work button{padding:0;border:0;background:none;cursor:pointer;line-height:0}
.faces{display:flex;gap:8px;flex-wrap:wrap}
.faces button{padding:3px;border:2px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer;line-height:0}
.faces button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.span-box{width:160px;height:160px;display:grid;place-items:center;font:650 5rem var(--display);border:2px solid var(--line);border-radius:12px;font-variant-numeric:tabular-nums}
.span-in{font:600 2rem var(--body);letter-spacing:.3em;text-align:center;width:min(340px,100%)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:8px}
.keypad button{height:52px;font:600 1.3rem var(--body);border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}
.keypad .okk{grid-column:span 2;background:var(--accent);color:var(--surface);border-color:var(--accent);font-size:1rem}
.board{position:relative;width:min(440px,100%);aspect-ratio:4/3;margin:0 auto;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.blk{position:absolute;width:13%;aspect-ratio:1;border-radius:8px;border:0;background:var(--muted);opacity:.55;cursor:pointer}
.blk:disabled{cursor:default}
.blk.lit{background:var(--mark);opacity:1}
.blk.tap{background:var(--accent);opacity:1}
.cdkey{display:grid;grid-template-columns:repeat(9,1fr);border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.cdkey div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-right:1px solid var(--line);color:var(--ink)}
.cdkey div:last-child{border-right:0}
.cdkey b{font-variant-numeric:tabular-nums}
.cdq{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0}
.cdd{font:650 3.6rem/1 var(--display)}
.cdbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.cdbtns button{height:64px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.ssrow{display:flex;gap:28px;justify-content:center;align-items:center;flex-wrap:wrap;padding:14px 0;color:var(--ink)}
.sst{display:flex;gap:8px;padding:8px 12px;border:2px solid var(--accent);border-radius:8px}
.ssg{display:flex;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:8px}
.scale-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.scale-row .small{min-width:64px;text-align:right}
.pan{display:inline-flex;gap:3px;padding:6px 10px;border-bottom:3px solid var(--ink);min-height:38px;align-items:center;flex-wrap:wrap;max-width:300px}
.pan.qm{font:650 1.4rem var(--display);color:var(--mark)}
.eqs{font-size:.82rem;color:var(--muted)}
.scale-row.ask{padding-top:8px;border-top:1px dashed var(--line)}
.idxrow{display:grid;grid-template-columns:230px 1fr 52px;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.idxrow.axisrow{border-top:0;padding-top:0}
@media (max-width:640px){.idxrow{grid-template-columns:1fr 46px}.idxrow .idxtrack{grid-column:1/3;grid-row:2}}
.idxtrack{position:relative;height:22px;border-radius:4px;background:color-mix(in srgb,var(--line) 55%,transparent)}
.idxtrack .avg,.sstrack .avg{position:absolute;top:0;bottom:0;background:var(--line)}
.idxtrack .l100{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.idxtrack .cib{position:absolute;top:7px;height:8px;border-radius:4px;background:color-mix(in srgb,var(--accent) 35%,transparent)}
.idxtrack .dot,.sstrack .dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.sstrack{position:relative;height:16px;border-radius:4px;background:color-mix(in srgb,var(--line) 45%,transparent)}
table.cm td,table.cm th{text-align:center;padding:5px}
@media (prefers-reduced-motion:no-preference){.progress i{transition:width .3s}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute;color:var(--ink)" aria-hidden="true"><defs>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="currentColor" stroke-width="3"/></pattern>
</defs></svg>
<header><div class="wrap bar">
  <div class="brand"><h1>Psychometric Assessment Suite</h1><small>Cognitive battery (FSIQ) · Reasoning screen · Big Five · RIASEC career interests</small></div>
  <nav id="nav"><button data-v="home">Take a test</button><button data-v="results">Results &amp; norms</button><button data-v="science">Science &amp; methods</button></nav>
</div></header>
<main><div class="wrap" id="app"></div></main>
<script>
/* ===== CORE: item banks + scoring (no DOM) ===== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function seededShuffle(arr,seed){const r=mulberry32(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- Big Five: IPIP 50-item Big-Five Factor Markers (Goldberg, 1992; public domain) ---------- */
/* trait: E Extraversion, A Agreeableness, C Conscientiousness, S Emotional Stability, O Intellect/Imagination */
const BF_ITEMS=[
["Am the life of the party.","E",1],["Feel little concern for others.","A",-1],["Am always prepared.","C",1],["Get stressed out easily.","S",-1],["Have a rich vocabulary.","O",1],
["Don't talk a lot.","E",-1],["Am interested in people.","A",1],["Leave my belongings around.","C",-1],["Am relaxed most of the time.","S",1],["Have difficulty understanding abstract ideas.","O",-1],
["Feel comfortable around people.","E",1],["Insult people.","A",-1],["Pay attention to details.","C",1],["Worry about things.","S",-1],["Have a vivid imagination.","O",1],
["Keep in the background.","E",-1],["Sympathize with others' feelings.","A",1],["Make a mess of things.","C",-1],["Seldom feel blue.","S",1],["Am not interested in abstract ideas.","O",-1],
["Start conversations.","E",1],["Am not interested in other people's problems.","A",-1],["Get chores done right away.","C",1],["Am easily disturbed.","S",-1],["Have excellent ideas.","O",1],
["Have little to say.","E",-1],["Have a soft heart.","A",1],["Often forget to put things back in their proper place.","C",-1],["Get upset easily.","S",-1],["Do not have a good imagination.","O",-1],
["Talk to a lot of different people at parties.","E",1],["Am not really interested in others.","A",-1],["Like order.","C",1],["Change my mood a lot.","S",-1],["Am quick to understand things.","O",1],
["Don't like to draw attention to myself.","E",-1],["Take time out for others.","A",1],["Shirk my duties.","C",-1],["Have frequent mood swings.","S",-1],["Use difficult words.","O",1],
["Don't mind being the center of attention.","E",1],["Feel others' emotions.","A",1],["Follow a schedule.","C",1],["Get irritated easily.","S",-1],["Spend time reflecting on things.","O",1],
["Am quiet around strangers.","E",-1],["Make people feel at ease.","A",1],["Am exacting in my work.","C",1],["Often feel blue.","S",-1],["Am full of ideas.","O",1]
];
/* Attention-check items (Curran, 2016): inserted after positions 17 and 39; expected answer 1 */
const AC_ITEMS=[{after:17,text:"To show you are reading carefully, choose “Very inaccurate” for this line.",expect:1},
                {after:39,text:"Please choose “Very inaccurate” here so we know you are paying attention.",expect:1}];
function personalitySequence(){const seq=[];BF_ITEMS.forEach((it,i)=>{seq.push({kind:"bf",idx:i,text:it[0]});AC_ITEMS.forEach((ac,k)=>{if(ac.after===i+1)seq.push({kind:"ac",idx:k,text:ac.text});});});return seq;}
const TRAITS={
E:{name:"Extraversion",lo:"Reserved, prefers small groups and quiet settings; recharges alone.",mid:"Comfortable socially but also values time alone.",hi:"Outgoing, energetic, talkative; enjoys groups and attention."},
A:{name:"Agreeableness",lo:"Direct, sceptical, competitive; puts the task before feelings.",mid:"Generally cooperative while able to stand firm.",hi:"Warm, kind, considerate; values harmony and helping others."},
C:{name:"Conscientiousness",lo:"Flexible and spontaneous; may find routines, deadlines and tidiness hard.",mid:"Reasonably organised; plans when it matters.",hi:"Organised, dependable, goal-directed; plans ahead and follows through."},
S:{name:"Emotional Stability",lo:"Feels stress, worry and mood changes strongly; may benefit from coping strategies.",mid:"Usually steady with occasional stress.",hi:"Calm, even-tempered, recovers quickly from setbacks."},
O:{name:"Intellect / Imagination",lo:"Practical and concrete; prefers the familiar.",mid:"Balances curiosity with practicality.",hi:"Curious, imaginative, enjoys ideas, reading and abstract thinking."}};
const TRAIT_ORDER=["O","C","E","A","S"];

/* ---------- Career interests: RIASEC (Holland, 1997) — items written for this suite, modelled on O*NET Interest Profiler activity items ---------- */
const RIASEC_ITEMS=[
["Repair a bicycle or motorbike","R"],["Do a science experiment in a lab","I"],["Draw, paint or design something","A"],["Teach or tutor younger students","S"],["Lead a team or a school club","E"],["Keep records and accounts neatly","C"],
["Build or make things with wood or tools","R"],["Solve challenging maths puzzles","I"],["Write stories, poems or articles","A"],["Help people work through their problems","S"],["Start a small business of my own","E"],["Organise files, data or a library","C"],
["Work outdoors on a farm, garden or field site","R"],["Learn how the human body works","I"],["Act in a play or perform on stage","A"],["Look after people who are sick or injured","S"],["Convince people to agree with my ideas","E"],["Work with numbers in a spreadsheet","C"],
["Operate machines or equipment","R"],["Find out why something happens by researching it","I"],["Play a musical instrument or sing","A"],["Volunteer for community service","S"],["Sell a product or service","E"],["Follow clear rules and procedures to finish a job","C"],
["Assemble electronic or robotics kits","R"],["Read about space, planets and the universe","I"],["Design clothes, posters, apps or websites","A"],["Coach a sports team","S"],["Organise and manage an event","E"],["Check documents carefully for errors","C"],
["Drive, fix or maintain vehicles","R"],["Analyse data to find patterns","I"],["Take creative photos or make videos","A"],["Listen to friends and give them advice","S"],["Debate or speak in public","E"],["Plan schedules and budgets","C"]];
const RIASEC={
R:{name:"Realistic",tag:"Doers",desc:"Hands-on work with tools, machines, plants or animals.",careers:"Mechanical / civil / automobile engineer, electrician, pilot, agriculture scientist, armed forces, physiotherapist, chef"},
I:{name:"Investigative",tag:"Thinkers",desc:"Observing, analysing and solving problems with ideas and evidence.",careers:"Doctor, research scientist, data scientist, software engineer, pharmacist, economist, forensic expert"},
A:{name:"Artistic",tag:"Creators",desc:"Self-expression, imagination and working without rigid rules.",careers:"Designer (graphic, fashion, UX), architect, writer / journalist, musician, animator, film-maker"},
S:{name:"Social",tag:"Helpers",desc:"Teaching, caring for and helping other people.",careers:"Teacher, counsellor / psychologist, nurse, social worker, HR professional, occupational therapist"},
E:{name:"Enterprising",tag:"Persuaders",desc:"Leading, persuading, selling and taking initiative.",careers:"Entrepreneur, manager, lawyer, marketing / sales, civil services, politician, hotel management"},
C:{name:"Conventional",tag:"Organisers",desc:"Working with data, records and clear procedures accurately.",careers:"Chartered accountant, banker, company secretary, auditor, actuary, administrator, logistics planner"}};
const RIASEC_ORDER=["R","I","A","S","E","C"];

function scorePersonality(bfResp,acResp,riResp,pageTimes){
  const raw={E:[],A:[],C:[],S:[],O:[]};
  BF_ITEMS.forEach((it,i)=>{const r=bfResp[i];if(r)raw[it[1]].push(it[2]>0?r:6-r);});
  const traits={};
  for(const t in raw){const a=raw[t];const m=a.reduce((x,y)=>x+y,0)/a.length;traits[t]={mean:+m.toFixed(3),pomp:Math.round((m-1)/4*100),n:a.length};}

/* --- Provisional norms: expert priors for adults, scaled by an age-band development factor.
       Replaced automatically by local norms once 30+ valid batteries exist in a band. --- */
const BAT_PRIOR={SI:[20,4.5],VC:[10.5,3],BD:[36,10],SR:[5,2],MR:[6.5,2.2],FW:[8.5,3],DS:[26,5],SP:[9,2.5],CD:[52,11],SS:[34,9]};
const BAT_MAX={SI:28,VC:16,BD:BD_MAX,SR:8,MR:10,FW:14,DS:46,SP:16,CD:250,SS:150};
const BAT_AGEF={"11–12":0.78,"13–14":0.86,"15–16":0.93,"17–18":0.97,"19–25":1,"26+":0.97,"Unknown":1};
const BAT_NORM_MIN=30;
function normalCdf(z){const t=1/(1+0.2316419*Math.abs(z)),d=0.3989423*Math.exp(-z*z/2);const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p;}
function batNormFor(key,band,pool){
  const g=(pool||[]).filter(r=>r.p.band===band).map(r=>r.raw[key]).filter(v=>v!=null);
  if(g.length>=BAT_NORM_MIN){const m=meanOf(g),sd=Math.sqrt(variance(g))||1;return {m,sd,local:true,n:g.length};}
  const f=BAT_AGEF[band]||1,[m,sd]=BAT_PRIOR[key];return {m:m*f,sd:sd*Math.sqrt(f),local:false,n:g.length};
}
function scaledScore(raw,nm){return Math.max(1,Math.min(19,Math.round(10+3*(raw-nm.m)/nm.sd)));}
function composite(sum,k,r){const mean=10*k,sd=3*Math.sqrt(k+k*(k-1)*r);return Math.max(40,Math.min(160,Math.round(100+15*(sum-mean)/sd)));}
function wechslerBand(s){if(s>=130)return"Extremely high";if(s>=120)return"Very high";if(s>=110)return"High average";if(s>=90)return"Average";if(s>=80)return"Low average";if(s>=70)return"Very low";return"Extremely low";}
const REL={index:0.85,FSIQ:0.93,GAI:0.91,CPI:0.86}; /* assumed until estimated from local data */
function ci90(score,rel){const h=Math.round(1.645*15*Math.sqrt(1-rel));return [score-h,score+h];}
function scoreBattery(rec,pool){
  const band=rec.p.band,ss={},norms={};
  BAT_SUBS.forEach(s=>{const nm=batNormFor(s.key,band,pool);norms[s.key]=nm;ss[s.key]=scaledScore(rec.raw[s.key],nm);});
  const idx={};BAT_INDEX_ORDER.forEach(k=>{const sum=BAT_INDEX[k].subs.reduce((a,s)=>a+ss[s],0);const sc=composite(sum,2,0.6);idx[k]={sum,score:sc,ci:ci90(sc,REL.index),pct:Math.round(normalCdf((sc-100)/15)*100),band:wechslerBand(sc)};});
  const comp=(subs,r,rel)=>{const sum=subs.reduce((a,s)=>a+ss[s],0),sc=composite(sum,subs.length,r);return {sum,score:sc,ci:ci90(sc,rel),pct:Math.round(normalCdf((sc-100)/15)*100),band:wechslerBand(sc)};};
  const FSIQ=comp(FSIQ_SUBS,0.45,REL.FSIQ),GAI=comp(GAI_SUBS,0.5,REL.GAI),CPI=comp(CPI_SUBS,0.4,REL.CPI);
  const scores=BAT_INDEX_ORDER.map(k=>idx[k].score),mIdx=meanOf(scores),spread=Math.max(...scores)-Math.min(...scores);
  const sw={};BAT_INDEX_ORDER.forEach(k=>{const d=idx[k].score-mIdx;sw[k]=d>=12?"S":d<=-12?"W":"";});
  const local=Object.values(norms).every(n=>n.local);
  return {ss,idx,FSIQ,GAI,CPI,sw,spread,meanIdx:mIdx,local,normN:norms.SI.n};
}

function runMC(el,cfg,done){
  const n=cfg.items.length,credits=[],choices=[],times=[];let i=0,zeros=0,t0=0,sel=-1,tick=null;
  function show(){
    sel=-1;t0=Date.now();const it=cfg.items[i];
    el.innerHTML=`<section class="card stack"><div class="spread"><p class="eyebrow">${cfg.name} · Item ${i+1} of ${n}</p>${cfg.limit?`<span class="timer" id="it">${cfg.limit}s</span>`:""}</div>
      ${it.prompt?`<h2>${it.prompt}</h2>`:""}${it.fig?`<div style="padding:6px 0">${it.fig}</div>`:""}
      <div class="opts ${cfg.cls}">${it.opts.map((o,k)=>`<button class="opt" data-o="${k}" aria-pressed="false" style="color:var(--ink)"><span class="lbl">${LETTERS[k]}</span>${o}</button>`).join("")}</div>
      <div class="spread"><span class="small muted">${cfg.hint||""}</span><button class="btn" id="nx" disabled>Next</button></div></section>`;
    el.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{sel=+b.dataset.o;el.querySelectorAll("[data-o]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));el.querySelector("#nx").disabled=false;});
    el.querySelector("#nx").onclick=()=>next(sel);
    if(cfg.limit)tick=every(()=>{const rem=cfg.limit-(Date.now()-t0)/1000,e=el.querySelector("#it");if(e){e.textContent=Math.ceil(Math.max(0,rem))+"s";e.classList.toggle("low",rem<10);}if(rem<=0)next(sel);},250);
  }
  function next(c){
    if(tick){clearInterval(tick);tick=null;}
    const cr=c>=0?cfg.items[i].credit[c]:0;credits.push(cr);choices.push(c);times.push(+((Date.now()-t0)/1000).toFixed(1));zeros=cr===0?zeros+1:0;i++;
    if(i>=n||(cfg.disc&&zeros>=cfg.disc)){const disc=i<n;while(credits.length<n){credits.push(0);choices.push(-2);times.push(0);}done({raw:credits.reduce((a,b)=>a+b,0),items:credits,choices,times,disc});}
    else show();
  }
  show();
}

  function practice(P){const seq=P.key==="S"?[6,1,4]:[5,2];present(seq,()=>ask("Practice: type your answer",v=>{const ok=v===dsExpected(P.key,seq);
    el.innerHTML=`<section class="card stack"><h2>${ok?"Correct.":"Not quite."}</h2><p>The numbers were <b>${seq.join(" · ")}</b>, so the answer is <b>${dsExpected(P.key,seq)}</b>.</p><div><button class="btn" id="go">Start ${P.name}</button></div></section>`;
    el.querySelector("#go").onclick=()=>run(P,0);el.querySelector("#go").focus();}));}
  function run(P,t){
    if(t>=P.seqs.length)return nextPart();
    const seq=P.seqs[t];present(seq,()=>ask(`${P.name} · ${seq.length} numbers`,v=>{const ok=v===dsExpected(P.key,seq);trials.push({part:P.key,len:seq.length,ok:ok?1:0});if(ok)longest[P.key]=Math.max(longest[P.key],seq.length);
      if(t%2===1&&!ok&&!trials[trials.length-2].ok)return nextPart();run(P,t+1);}));
  }
  function nextPart(){pi++;if(pi>=DS_PARTS.length){const sc=k=>trials.filter(x=>x.part===k&&x.ok).length;done({raw:trials.filter(x=>x.ok).length,F:sc("F"),B:sc("B"),S:sc("S"),longest,trials});}else part();}
  part();
},

SP(el,done){
  const trials=[];let longest=0;
  const board=lit=>`<div class="board">${SP_POS.map(([x,y],k)=>`<button class="blk ${lit===k?"lit":""}" data-b="${k}" style="left:${x}%;top:${y}%" aria-label="Block ${k+1}" disabled></button>`).join("")}</div>`;
  function present(seq,label,cb){
    el.innerHTML=`<section class="card stack"><div class="spread"><p class="eyebrow">${label}</p><span class="small muted" id="spm">Watch</span></div>${board(-1)}</section>`;
    const bl=[...el.querySelectorAll(".blk")];let k=0;
    const step=()=>{if(k>=seq.length){later(()=>respond(seq,cb),300);return;}const b=bl[seq[k++]];b.classList.add("lit");later(()=>{b.classList.remove("lit");later(step,300);},700);};later(step,800);
  }
  function respond(seq,cb){const bl=[...el.querySelectorAll(".blk")],got=[];el.querySelector("#spm").textContent="Now tap the blocks in the same order";
    bl.forEach(b=>{b.disabled=false;b.onclick=()=>{got.push(+b.dataset.b);b.classList.add("tap");later(()=>b.classList.remove("tap"),250);if(got.length===seq.length){bl.forEach(x=>x.disabled=true);later(()=>cb(got.join(",")===seq.join(",")),350);}};});}
  function run(t){if(t>=SP_SEQS.length)return fin();const seq=SP_SEQS[t];
    present(seq,`Spatial Span · ${seq.length} blocks`,ok=>{trials.push({len:seq.length,ok:ok?1:0});if(ok)longest=Math.max(longest,seq.length);
      if(t%2===1&&!ok&&!trials[trials.length-2].ok)return fin();run(t+1);});}
  function fin(){done({raw:trials.filter(x=>x.ok).length,longest,trials});}

},

async function finishBattery(){
  const r=S.run,res=r.res,raw={};BAT_SUBS.forEach(s=>raw[s.key]=res[s.key].raw);
  const flags=[];
  if(res.CD.attempted&&res.CD.errors/res.CD.attempted>0.15)flags.push(`Symbol Coding error rate ${Math.round(res.CD.errors/res.CD.attempted*100)}%`);
  if(res.SS.attempted&&res.SS.errors/res.SS.attempted>0.25)flags.push(`Symbol Search error rate ${Math.round(res.SS.errors/res.SS.attempted*100)}%`);
  if(res.DS.longest.F<3)flags.push("Digit Span forward below 3, check the task was understood");
  const fast=["SI","VC","MR","FW","SR"].reduce((a,k)=>a+res[k].times.filter((t,j)=>res[k].choices[j]>=0&&t<2).length,0);
  if(fast>=8)flags.push(`${fast} reasoning answers given in under 2 seconds`);
  const rec={id:"bt-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),ts:Date.now(),type:"battery",p:pubP(),raw,res,
    durationSec:Math.round((Date.now()-r.start)/1000),validity:{flags,valid:flags.length===0},version:"1.0"};
  const sc=scoreBattery(rec,validBat());rec.snapshot={FSIQ:sc.FSIQ.score,GAI:sc.GAI.score,CPI:sc.CPI.score,...Object.fromEntries(BAT_INDEX_ORDER.map(k=>[k,sc.idx[k].score])),local:sc.local};
  S.run=null;batClearProgress();await saveRecord(rec);S.report=rec;S.reportFrom="home";setView("report");
}
function validBat(){return allRecords().filter(r=>r.type==="battery"&&r.validity&&r.validity.valid);}

function batReport(rec){

  const strong=BAT_INDEX_ORDER.filter(k=>sc.sw[k]==="S"),weak=BAT_INDEX_ORDER.filter(k=>sc.sw[k]==="W");

    <div class="idxtrack"><span class="avg" style="left:${X(85)}%;width:${X(115)-X(85)}%"></span><span class="l100" style="left:${X(100)}%"></span><span class="cib" style="left:${X(o.ci[0])}%;width:${X(o.ci[1])-X(o.ci[0])}%"></span><span class="dot" style="left:${X(o.score)}%"></span></div><span class="num" style="font-size:1.15rem">${o.score}</span></div>`;
  const ds=rec.res.DS;
  const story=[];
  story.push(`${esc(rec.p.name)}'s overall score (FSIQ ${sc.FSIQ.score}) falls in the <b>${sc.FSIQ.band.toLowerCase()}</b> range, higher than about ${sc.FSIQ.pct}% of people of the same age${sc.local?" in your local sample":""}.`);
  if(strong.length)story.push(`Relative strength in ${strong.map(k=>BAT_INDEX[k].name).join(" and ")}, compared with the participant's own average.`);
  if(weak.length)story.push(`Relative weakness in ${weak.map(k=>BAT_INDEX[k].name).join(" and ")}. Use it to target support, not as a diagnosis.`);
  if(!strong.length&&!weak.length)story.push("The five index scores are fairly even, so the overall score summarises the profile well.");
  if(sc.spread>=23)story.push(`The index scores differ by ${sc.spread} points. With a spread this large, describe the profile index by index rather than relying on one overall number. The General Ability Index (${sc.GAI.score}) leaves out memory and speed and may better reflect reasoning ability.`);
  if(ds.longest.F-ds.longest.B>=3)story.push(`Forward span (${ds.longest.F}) is much longer than backward span (${ds.longest.B}). This suggests holding information is easier than mentally manipulating it.`);
  return `<section class="card stack">${reportHead(rec)}
    <div class="score-hero">
      <div><p class="eyebrow">Full Scale IQ ${sc.local?"(local norms)":"(provisional)"}</p><div class="big">${sc.FSIQ.score}</div><p class="small muted">90% range ${sc.FSIQ.ci[0]}–${sc.FSIQ.ci[1]} · ${sc.FSIQ.band} · percentile ${sc.FSIQ.pct}</p></div>
      <div><p class="eyebrow">General Ability Index</p><div class="big" style="font-size:2.2rem">${sc.GAI.score}</div><p class="small muted">Reasoning without memory &amp; speed</p></div>
      <div><p class="eyebrow">Cognitive Proficiency Index</p><div class="big" style="font-size:2.2rem">${sc.CPI.score}</div><p class="small muted">Memory &amp; speed</p></div>
    </div>${validityBox(rec)}</section>
  <section class="card stack"><div class="spread"><h3>Index profile</h3><span class="small muted">Shaded = average range 85–115 · bar = 90% confidence range</span></div>
    ${BAT_INDEX_ORDER.map(k=>idxRow(BAT_INDEX[k].name,sc.idx[k],sc.sw[k])).join("")}
    <div class="idxrow axisrow"><span></span><div class="ci-labels"><span>40</span><span>70</span><span>100</span><span>130</span><span>160</span></div><span></span></div>
    ${idxRow("Full Scale IQ",sc.FSIQ,"")}</section>
  <section class="card stack"><div class="spread"><h3>Subtest scaled scores</h3><span class="small muted">Mean 10, SD 3 · 8–12 is average</span></div>
    <div class="tablebox"><table class="sstable"><thead><tr><th>Index</th><th>Subtest</th><th>Raw</th><th>Scaled</th><th style="min-width:220px">1 · · · · 10 · · · · 19</th></tr></thead><tbody>
    ${BAT_INDEX_ORDER.map(k=>BAT_INDEX[k].subs.map((s,j)=>{const sub=BAT_SUBS.find(x=>x.key===s),v=sc.ss[s];return `<tr><td>${j===0?BAT_INDEX[k].name:""}</td><td>${sub.name}${FSIQ_SUBS.includes(s)?"":' <span class="small muted">(supplemental)</span>'}</td><td>${rec.raw[s]}</td><td class="num" style="text-align:left">${v}</td>
      <td><div class="sstrack"><span class="avg" style="left:${(7.5)/18*100}%;width:${5/18*100}%"></span><span class="dot" style="left:${(v-1)/18*100}%"></span></div></td></tr>`;}).join("")).join("")}</tbody></table></div>
    <p class="small muted">Digit Span: longest forward ${ds.longest.F}, backward ${ds.longest.B}, sequencing ${ds.longest.S}. Symbol Coding: ${rec.res.CD.raw} correct, ${rec.res.CD.errors} errors. Symbol Search: ${rec.res.SS.correct} correct, ${rec.res.SS.errors} errors.</p></section>
  <section class="card stack prose" style="max-width:none"><h3>Summary</h3>${story.map(s=>`<p>${s}</p>`).join("")}
    <p class="note">${sc.local?`Scores compare this participant with ${sc.normN} valid results from the same age band collected with this battery.`:`Scores are provisional: they use estimated age norms until ${BAT_NORM_MIN} valid batteries exist for age band ${esc(rec.p.band)} (currently ${sc.normN}). They then switch to local norms automatically.`} This battery follows the Wechsler index structure but uses original, unstandardised items. It is a screening and counselling tool, not a WAIS or WISC result, and must not be used for diagnosis.</p></section>`;
}

(async()=>{

/* ---------- figures ---------- */
function shapeSVG(shape,cx,cy,s,fill,rot){
  const f=fill==="solid"?"currentColor":fill==="striped"?"url(#hatch)":"none";
  const a=`fill="${f}" stroke="currentColor" stroke-width="3" stroke-linejoin="round"`;
  if(shape==="circle")return `<circle cx="${cx}" cy="${cy}" r="${s/2}" ${a}/>`;
  if(shape==="square")return `<rect x="${cx-s/2+2}" y="${cy-s/2+2}" width="${s-4}" height="${s-4}" ${a}/>`;
  if(shape==="triangle"){const h=s/2;return `<polygon points="${cx},${cy-h} ${cx+h},${cy+h*.8} ${cx-h},${cy+h*.8}" ${a}/>`;}
  if(shape==="arrow"){const P=[[0,-.5],[.4,-.02],[.15,-.02],[.15,.5],[-.15,.5],[-.15,-.02],[-.4,-.02]];
    return `<polygon points="${P.map(([x,y])=>`${cx+x*s},${cy+y*s}`).join(" ")}" transform="rotate(${rot} ${cx} ${cy})" ${a}/>`;}
  return "";
}
const POS={1:[[50,50]],2:[[29,50],[71,50]],3:[[50,28],[28,71],[72,71]],4:[[29,29],[71,29],[29,71],[71,71]]};
const SZ={1:50,2:32,3:30,4:30};
function cellSVG(c){return `<svg viewBox="0 0 100 100" width="80" height="80" aria-hidden="true">${POS[c.n].map(([x,y])=>shapeSVG(c.shape,x,y,SZ[c.n],c.fill,c.rot)).join("")}</svg>`;}
function polySVG(cells){
  const w=Math.max(...cells.map(p=>p[0]))+1,h=Math.max(...cells.map(p=>p[1]))+1,u=16,ox=50-w*u/2,oy=50-h*u/2;
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${cells.map(([x,y])=>`<rect x="${ox+x*u}" y="${oy+y*u}" width="${u}" height="${u}" fill="currentColor" fill-opacity=".85" stroke="var(--surface)" stroke-width="1.5"/>`).join("")}</svg>`;
}

/* ---------- norms ---------- */
function validIQ(){return allRecords().filter(r=>r.type==="iq"&&r.validity&&r.validity.valid);}
function validPers(){return allRecords().filter(r=>r.type==="personality"&&r.validity&&r.validity.valid);}
const NORM_MIN=30;
function localIQ(rec){
  const pool=validIQ().filter(r=>r.p.band===rec.p.band);if(pool.length<NORM_MIN)return {n:pool.length};
  const th=pool.map(r=>r.theta),m=meanOf(th),sd=Math.sqrt(variance(th));
  const z=(rec.theta-m)/sd,pr=Math.round(pool.filter(r=>r.theta<rec.theta).length/pool.length*100+pool.filter(r=>r.theta===rec.theta).length/pool.length*50);
  return {n:pool.length,iq:Math.round(100+15*z),pr};
}
function persPct(rec,t){const pool=validPers();if(pool.length<NORM_MIN)return null;const v=rec.traits[t].pomp;
  return Math.round((pool.filter(r=>r.traits[t].pomp<v).length+pool.filter(r=>r.traits[t].pomp===v).length/2)/pool.length*100);}

function iqReport(rec){

    ${doms.map(([k,d])=>`<div class="trait"><b>${d.name}</b><div class="track"><i style="width:${d.c/d.n*100}%"></i></div><span class="num">${d.c}/${d.n}</span></div>`).join("")}

  <section class="card stack"><h3>Personality: internal consistency</h3>${psA}<p class="small muted">Published IPIP-50 alphas are about .76–.87 per trait; values below .70 in your sample suggest translation or comprehension problems.</p></section>
  <section class="card stack"><div class="spread"><h3>All participants</h3><div class="row">${[["all","All"],["battery","Battery"],["iq","Reasoning"],["personality","Personality"]].map(([k,l])=>`<button class="btn ${S.filter===k?"":"ghost"}" data-filter="${k}" style="padding:6px 12px">${l}</button>`).join("")}</div></div>
  ${list.length?`<div class="tablebox"><table><thead><tr><th>Date</th><th>Name</th><th>Age</th><th>Class</th><th>Test</th><th>Result</th><th>Quality</th><th></th></tr></thead><tbody>
  ${list.map(r=>`<tr><td>${new Date(r.ts).toLocaleDateString("en-IN",{day:"numeric",month:"short"})}</td><td>${esc(r.p.name)}</td><td>${esc(r.p.age)}</td><td>${esc(r.p.cls)}</td><td>${{iq:"Reasoning",battery:"Battery",personality:"Personality"}[r.type]}</td><td>${r.type==="iq"?`IQ ${r.iq} (raw ${r.raw})`:r.type==="battery"?`FSIQ ${scoreBattery(r,vb).FSIQ.score}`:`${esc(r.code)} · C ${r.traits.C.pomp}`}</td><td>${r.validity.valid?'<span class="pill ok">OK</span>':'<span class="pill warn">Check</span>'}</td><td><button class="btn ghost" data-open="${esc(r.id)}" style="padding:5px 10px">Open</button></td></tr>`).join("")}</tbody></table></div>`
  :`<p class="muted">No results yet. Completed tests appear here.</p>`}</section></div>`;
}
function toCSV(){
  const rows=[["id","date","test","name","age","age_band","class","gender","quality_ok","flags","duration_sec","prov_iq","ci90","raw","theta","se","matrix","series","verbal","spatial","O","C","E","A","S_stability","R","I","A_art","S_soc","E_ent","C_conv","holland_code",...BAT_SUBS.map(s=>"bat_raw_"+s.key),...BAT_SUBS.map(s=>"bat_ss_"+s.key),...BAT_INDEX_ORDER,"FSIQ","GAI","CPI","bat_norms",...IQ_BANK.map(i=>i.id),...BF_ITEMS.map((_,i)=>"bf"+(i+1)),...RIASEC_ITEMS.map((_,i)=>"ri"+(i+1))]];
  const vb=validBat();
  allRecords().forEach(r=>{const iq=r.type!=="personality",d=r.domains||{},bt=r.type==="battery",bs=bt?scoreBattery(r,vb):null;
    rows.push([r.id,new Date(r.ts).toISOString(),r.type,r.p.name,r.p.age,r.p.band,r.p.cls,r.p.gender,r.validity.valid?1:0,r.validity.flags.join(" | "),r.durationSec,
      ...(r.type==="iq"?[r.iq,r.ci,r.raw,r.theta,r.se,d["Gf-M"].c,d["Gf-S"].c,d["Gc"].c,d["Gv"].c]:["","","","","","","","",""]),
      ...TRAIT_ORDER.map(t=>iq?"":r.traits[t].pomp),...RIASEC_ORDER.map(k=>iq?"":r.riasec[k]),iq?"":r.code,...BAT_SUBS.map(s=>bt?r.raw[s.key]:""),...BAT_SUBS.map(s=>bt?bs.ss[s.key]:""),...BAT_INDEX_ORDER.map(k=>bt?bs.idx[k].score:""),bt?bs.FSIQ.score:"",bt?bs.GAI.score:"",bt?bs.CPI.score:"",bt?(bs.local?"local":"provisional"):"",
      ...IQ_BANK.map((_,i)=>r.type==="iq"?r.correct[i]:""),...BF_ITEMS.map((_,i)=>iq?"":r.bf[i]),...RIASEC_ITEMS.map((_,i)=>iq?"":r.ri[i])]);});
  return rows.map(r=>r.map(v=>{v=String(v??"");return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;}).join(",")).join("\n");
}

/* ---------- science ---------- */
function scienceView(){
  return `<div class="stack">
  <section class="card prose" style="max-width:none;gap:14px"><p class="eyebrow">Evidence base</p><h2>What each test measures and why it is credible</h2>
  <div class="grid2">
    <div class="stack" style="gap:8px"><h3>Big Five personality (IPIP-50)</h3><p class="small">Uses the 50 public-domain Big-Five Factor Markers published by Goldberg (1992) through the International Personality Item Pool, with original wording and scoring keys. The five-factor model is the most replicated structure of personality across cultures, including India. In published samples each 10-item scale has internal consistency around α = .76–.87. Conscientiousness is the strongest personality predictor of academic performance (Poropat, 2009) and of later life outcomes (Roberts et al., 2007).</p></div>
    <div class="stack" style="gap:8px"><h3>Career interests (RIASEC)</h3><p class="small">Holland's six-type model is the basis of most career-guidance tools worldwide, including the US Department of Labor's O*NET Interest Profiler. Interest–occupation fit predicts job performance and persistence (Nye et al., 2012). The 36 activity items here are written for this suite in the O*NET style with Indian school examples. Their reliability should be confirmed on your own data (Results tab).</p></div>
    <div class="stack" style="gap:8px"><h3>Reasoning test</h3><p class="small">Item types follow the International Cognitive Ability Resource (Condon &amp; Revelle, 2014): matrix reasoning, series completion, verbal reasoning and mental rotation. These sample three broad abilities in the Cattell-Horn-Carroll model (fluid reasoning Gf, crystallised knowledge Gc, visual processing Gv), whose shared variance is general intelligence (g). g measured this way correlates about .8 with later national exam results (Deary et al., 2007). All 40 items are original, so they need local calibration before the score is treated as normed.</p></div>
    <div class="stack" style="gap:8px"><h3>Response-quality checks</h3><p class="small">Careless answers are a major threat to validity in self-report tests. The personality test uses two instructed-response items, long-string analysis, answer variance and time per item (Curran, 2016). The reasoning test flags very fast answers, low completion and Guttman errors (passing hard items while failing easy ones), a standard person-fit signal.</p></div>
  </div></section>
  <section class="card prose" style="max-width:none"><p class="eyebrow">Cognitive Profile Battery</p><h2>How it relates to the WAIS and WISC</h2>
  <p>The Wechsler scales (WAIS-5 for adults, WISC-V for ages 6–16) are the most widely used IQ tests. They report a Full Scale IQ plus five index scores, each built from two or more subtests scored on a mean-10, SD-3 scale. This battery copies that <b>structure and scoring method</b>, not the test itself.</p>
  <div class="tablebox"><table><thead><tr><th>Index</th><th>Subtests here</th><th>Comparable Wechsler subtests</th></tr></thead><tbody>
  <tr><td>Verbal Comprehension</td><td>Similarities, Vocabulary</td><td>Similarities, Vocabulary</td></tr>
  <tr><td>Visual Spatial</td><td>Block Patterns, Shape Rotation</td><td>Block Design, Visual Puzzles</td></tr>
  <tr><td>Fluid Reasoning</td><td>Matrix Reasoning, Balance Puzzles</td><td>Matrix Reasoning, Figure Weights</td></tr>
  <tr><td>Working Memory</td><td>Digit Span (forward, backward, sequencing), Spatial Span</td><td>Digit Span, Picture Span</td></tr>
  <tr><td>Processing Speed</td><td>Symbol Coding, Symbol Search</td><td>Coding, Symbol Search</td></tr></tbody></table></div>
  <p>As in the WISC-V, the Full Scale IQ uses seven core subtests (Block Patterns, Similarities, Matrix Reasoning, Digit Span, Symbol Coding, Vocabulary, Balance Puzzles). The General Ability Index uses the five reasoning subtests; the Cognitive Proficiency Index uses the four memory and speed subtests. Composites come from summed scaled scores: 100 + 15 × (sum − expected sum) ÷ SD of the sum, where the SD allows for the usual correlation between subtests. An index 12 or more points from the participant's own index average is flagged as a relative strength or weakness.</p>
  <p><b>What is different from a real Wechsler test.</b> The items here are original, because Wechsler items are copyrighted by Pearson. The real tests are normed on large samples stratified by age, sex, region and education, and given one-to-one by a trained examiner who scores spoken answers. This battery is self-administered on a screen, uses multiple-choice verbal items, and starts with estimated norms. Treat it as a well-structured screening and counselling tool until your own norms are built.</p></section>
  <section class="card prose" style="max-width:none"><p class="eyebrow">Scoring</p><h2>How the reasoning-screen IQ estimate is calculated</h2>
  <ol>
    <li>Each item has a difficulty <i>b</i> on the ability scale (–2 = easy, +2 = hard) and a guessing floor <i>c</i> = 1 ÷ number of options.</li>
    <li>The probability of a correct answer follows the three-parameter logistic model: P(θ) = c + (1 − c) / (1 + e<sup>−1.7·a·(θ − b)</sup>), with a = 1.2.</li>
    <li>Ability θ is the expected a-posteriori (EAP) estimate given the full answer pattern, with a standard normal prior. Its posterior SD is the standard error.</li>
    <li>Provisional IQ = 100 + 15θ, and the 90% range is ±1.645 × 15 × SE. Raw scores of 20/40 map to about 100.</li>
    <li>Once 30 or more valid results exist in an age band, a <b>local deviation IQ</b> is computed as 100 + 15 × (θ − band mean) ÷ band SD. This is the same principle Wechsler tests use, applied to your own population.</li>
  </ol>
  <p class="note">Honest limits: no test becomes “scientifically validated” by design alone. Validity comes from evidence collected on real participants. Until your sample is large enough, report the provisional IQ as an estimate with its range, never as a fixed number.</p></section>
  <section class="card prose" style="max-width:none"><p class="eyebrow">Validation roadmap</p><h2>Turning this into a normed test for your school</h2>
  <ol>
    <li><b>Pilot (n ≈ 100–200 across Classes 6–12).</b> Run both tests under standard conditions. Check that KR-20 for the reasoning test reaches .85 or higher and each Big Five alpha .70 or higher.</li>
    <li><b>Item review.</b> Replace or reword any item the Results tab flags (pass rate below 15% or above 95%, or item–rest r below .15).</li>
    <li><b>Re-calibrate difficulties.</b> Fit a Rasch or 2PL model to the CSV export (e.g. R package <i>mirt</i>) and update each item's <i>b</i>.</li>
    <li><b>Norms.</b> Aim for 100+ valid results per age band. Below 30, show only the provisional score.</li>
    <li><b>Validity evidence.</b> Correlate reasoning scores with term marks in maths and science (expect r ≈ .4–.6) and Conscientiousness with homework completion and attendance. Retest a sub-group after 2–4 weeks (target r ≥ .80).</li>
    <li><b>Fairness.</b> Compare item pass rates by gender and Hindi- vs English-medium background. If translating, use forward–back translation.</li>
  </ol></section>
  <section class="card prose" style="max-width:none"><p class="eyebrow">Ethics</p><h2>Responsible use</h2>
  <ul><li>Get written consent from parents for students under 18, and explain how results will be used.</li>
  <li>Share results in a feedback conversation, not as a printout alone. Avoid labels like “low IQ” in front of students or parents.</li>
  <li>Use these results for guidance only. Admission, streaming or diagnostic decisions require multiple sources of evidence and, for diagnosis, a licensed psychologist (AERA, APA &amp; NCME Standards, 2014).</li>
  <li>Keep reports confidential. Results saved on this page are visible only to you and anyone you make an editor.</li></ul></section>
  <section class="card prose refs" style="max-width:none"><p class="eyebrow">References</p><ol>
  <li>Jaeger, J. (2018). Digit Symbol Substitution Test: The case for sensitivity over specificity in neuropsychological testing. <i>Journal of Clinical Psychopharmacology, 38</i>, 513–519.</li>
  <li>Kessels, R. P. C., van Zandvoort, M. J. E., Postma, A., Kappelle, L. J., &amp; de Haan, E. H. F. (2000). The Corsi block-tapping task: Standardization and normative data. <i>Applied Neuropsychology, 7</i>, 252–258.</li>
  <li>Wechsler, D. (2014). <i>Wechsler Intelligence Scale for Children, Fifth Edition (WISC-V).</i> Bloomington, MN: Pearson.</li>
  <li>Wechsler, D. (2024). <i>Wechsler Adult Intelligence Scale, Fifth Edition (WAIS-5).</i> Bloomington, MN: Pearson.</li>
  <li>AERA, APA &amp; NCME (2014). <i>Standards for Educational and Psychological Testing.</i> Washington, DC: AERA.</li>
  <li>Condon, D. M., &amp; Revelle, W. (2014). The International Cognitive Ability Resource: Development and initial validation of a public-domain measure. <i>Intelligence, 43</i>, 52–64.</li>
  <li>Curran, P. G. (2016). Methods for the detection of carelessly invalid responses in survey data. <i>Journal of Experimental Social Psychology, 66</i>, 4–19.</li>
  <li>Deary, I. J., Strand, S., Smith, P., &amp; Fernandes, C. (2007). Intelligence and educational achievement. <i>Intelligence, 35</i>, 13–21.</li>
  <li>Embretson, S. E., &amp; Reise, S. P. (2000). <i>Item Response Theory for Psychologists.</i> Mahwah, NJ: Erlbaum.</li>
  <li>Goldberg, L. R. (1992). The development of markers for the Big-Five factor structure. <i>Psychological Assessment, 4</i>, 26–42.</li>
  <li>Goldberg, L. R., et al. (2006). The International Personality Item Pool and the future of public-domain personality measures. <i>Journal of Research in Personality, 40</i>, 84–96.</li>
  <li>Holland, J. L. (1997). <i>Making Vocational Choices</i> (3rd ed.). Odessa, FL: PAR.</li>
  <li>McGrew, K. S. (2009). CHC theory and the human cognitive abilities project. <i>Intelligence, 37</i>, 1–10.</li>
  <li>Nye, C. D., Su, R., Rounds, J., &amp; Drasgow, F. (2012). Vocational interests and performance. <i>Perspectives on Psychological Science, 7</i>, 384–403.</li>
  <li>Poropat, A. E. (2009). A meta-analysis of the five-factor model of personality and academic performance. <i>Psychological Bulletin, 135</i>, 322–338.</li>
  <li>Roberts, B. W., Kuncel, N. R., Shiner, R., Caspi, A., &amp; Goldberg, L. R. (2007). The power of personality. <i>Perspectives on Psychological Science, 2</i>, 313–345.</li>
  </ol><p class="small muted">IPIP items: <a href="https://ipip.ori.org">ipip.ori.org</a> (public domain). ICAR: <a href="https://icar-project.org">icar-project.org</a>.</p></section></div>`;
}

/* ---------- events ---------- */
function bind(){
  const app=$("#app");
  app.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{const e=readParticipant();if(e){$("#perr").textContent=e;$("#perr").scrollIntoView({block:"center"});return;}
    S.reportFrom="home";const k=b.dataset.start;k==="pers"?startPers():k==="bat"?startBattery(false):startIQ();});
  if($("#bres"))$("#bres").onclick=()=>{S.reportFrom="home";startBattery(true);};
  if($("#bdiscard"))$("#bdiscard").onclick=()=>confirmBox("Discard the unfinished battery?","The completed subtests will be deleted from this device.","Discard",()=>{batClearProgress();render();});
  if(S.view==="bat"){
    if(S.run.phase==="sub")batMount();
    else{$("#bgo").onclick=()=>{S.run.phase="sub";render();window.scrollTo(0,0);};$("#bexit").onclick=()=>{S.run=null;setView("home");toast("Progress saved on this device. Resume from the home page.");};}
  }
  if(S.view==="pers"){
    app.querySelectorAll(".scale button").forEach(b=>b.onclick=()=>{const r=S.run,it=r.pages[r.page][+b.dataset.q],v=+b.dataset.v;
      if(it.kind==="bf")r.bf[it.idx]=v;else if(it.kind==="ac")r.ac[it.idx]=v;else r.ri[it.idx]=v;
      b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));b.closest(".likert-row").classList.remove("missing");
      const done=r.bf.filter(Boolean).length+r.ac.filter(Boolean).length+r.ri.filter(Boolean).length;app.querySelector(".progress i").style.width=done/88*100+"%";});
    $("#pprev").onclick=()=>{S.run.page--;S.run.missing=false;render();window.scrollTo(0,0);};
    $("#pnext").onclick=()=>{const r=S.run;if(r.pages[r.page].some(it=>!getResp(it))){r.missing=true;render();app.querySelector(".missing")?.scrollIntoView({block:"center"});return;}
      r.times[r.page]=(r.times[r.page]||0)+(Date.now()-r.enter)/1000;r.enter=Date.now();r.missing=false;
      if(r.page===r.pages.length-1)finishPers();else{r.page++;render();window.scrollTo(0,0);}};
  }
  if(S.view==="iqintro"){
    app.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{app.querySelectorAll("[data-ex]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
      $("#exfb").textContent=b.dataset.ex==="2"?"Correct: each number is one more than the last. In the real test you'll get no feedback.":"Not quite: each number goes up by one, so the answer is 6 (C). In the real test you'll get no feedback.";});
    $("#iqgo").onclick=()=>{S.run.start=Date.now();S.run.enter=Date.now();S.view="iq";render();
      timerId=setInterval(()=>{const t=$("#timer");const rem=remaining();if(t){t.textContent=fmt(rem);t.classList.toggle("low",rem<120);}if(rem<=0){finishIQ();toast("Time is up. Your answers have been submitted.");}},1000);};
    $("#iqback").onclick=()=>{S.run=null;setView("home");};
  }
  if(S.view==="iq"){
    const go=i=>{logTime();S.run.i=i;render();};
    app.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{S.run.choices[S.run.i]=+b.dataset.opt;app.querySelectorAll("[data-opt]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
      const pb=app.querySelector(`[data-jump="${S.run.i}"]`);pb&&pb.classList.add("done");});
    app.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>go(+b.dataset.jump));
    $("#qprev").onclick=()=>go(S.run.i-1);
    $("#qnext").onclick=()=>{if(S.run.i<IQ_BANK.length-1)go(S.run.i+1);else{const left=S.run.choices.filter(x=>x===-1).length;confirmBox("Submit your answers?",left?`${left} question${left>1?"s are":" is"} still unanswered and will count as wrong. You have ${fmt(remaining())} left.`:"You have answered every question.","Submit test",finishIQ);}};
    $("#qfinish").onclick=()=>{const left=S.run.choices.filter(x=>x===-1).length;confirmBox("Finish the test now?",`${left} unanswered question${left===1?"":"s"} will count as wrong. You have ${fmt(remaining())} left.`,"Submit test",finishIQ);};
  }
  if(S.view==="report"){
    $("#rback").onclick=()=>setView(S.reportFrom==="results"?"results":"home");
    $("#rdl").onclick=()=>{const r=S.report,css=document.querySelector("style").textContent;
      const html=`<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>${esc(r.p.name)} – ${r.type} report</title><style>${css}</style></head><body><main><div class="wrap stack">${$("#reportBody").innerHTML}</div></main>${document.querySelector("svg").outerHTML}</body></html>`;
      offerFile(`${r.p.name.replace(/[^\w-]+/g,"_")}_${r.type}_report.html`,html);};
  }
  if(S.view==="results"){
    app.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{S.filter=b.dataset.filter;render();});
    app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{S.report=allRecords().find(r=>r.id===b.dataset.open);S.reportFrom="results";setView("report");});
    const c=$("#csv");if(c)c.onclick=()=>offerFile(`assessment_results_${new Date().toISOString().slice(0,10)}.csv`,toCSV());
  }
}
render();

function batAnalytics(){
  const vb=validBat();
  if(vb.length<5)return `<p class="muted small">Subtest reliability and correlations appear after 5 valid batteries (${vb.length} so far). Local norms take over from estimated norms at ${BAT_NORM_MIN} per age band.</p>`;
  const itemKeys={SI:1,VC:1,MR:1,FW:1,SR:1,BD:1};
  const rows=BAT_SUBS.map(s=>{const v=vb.map(r=>r.raw[s.key]);const a=itemKeys[s.key]?cronbach(vb.map(r=>r.res[s.key].items)):null;
    return `<tr><td>${s.name}</td><td>${BAT_INDEX[s.idx].name}</td><td>${meanOf(v).toFixed(1)}</td><td>${Math.sqrt(variance(v)).toFixed(1)}</td><td>${a==null?'<span class="small muted">retest needed</span>':a.toFixed(2)}</td></tr>`;}).join("");
  let cm="";if(vb.length>=10){const K=BAT_SUBS.map(s=>s.key);
    cm=`<details><summary class="small" style="cursor:pointer">Subtest correlation matrix (n = ${vb.length})</summary><div class="tablebox"><table class="cm"><thead><tr><th></th>${K.map(k=>`<th>${k}</th>`).join("")}</tr></thead><tbody>${K.map(a=>`<tr><th>${a}</th>${K.map(b=>{if(a===b)return "<td>–</td>";const r=corr(vb.map(x=>x.raw[a]),vb.map(x=>x.raw[b]));const same=BAT_SUBS.find(s=>s.key===a).idx===BAT_SUBS.find(s=>s.key===b).idx;return `<td style="${same?"background:var(--accent-soft);font-weight:600":""}">${r.toFixed(2)}</td>`;}).join("")}</tr>`).join("")}</tbody></table></div>
    <p class="small muted">Highlighted cells pair subtests from the same index. If the battery measures what it claims, these should usually be higher than the other correlations, and all correlations should be positive (the “positive manifold” behind g).</p></details>`;}
  const bands=["11–12","13–14","15–16","17–18","19–25","26+"];
  return `<div class="facts"><span>Valid batteries <b>${vb.length}</b></span>${bands.map(b=>{const n=vb.filter(r=>r.p.band===b).length;return n?`<span>${b}: <b>${n}</b>${n>=BAT_NORM_MIN?" (local norms)":""}</span>`:"";}).join("")}</div>
  <div class="tablebox"><table><thead><tr><th>Subtest</th><th>Index</th><th>Mean raw</th><th>SD</th><th>Reliability (α)</th></tr></thead><tbody>${rows}</tbody></table></div>${cm}`;
}
