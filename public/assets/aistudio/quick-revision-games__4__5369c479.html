<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Quick Revise · Study Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF7ED;--ink:#1E293B;--mut:#64748B;--card:#fff;--line:#F3E3CF;
  --pri:#FF6B35;--ok:#16A34A;--okb:#DCFCE7;--bad:#DC2626;--badb:#FEE2E2;--warn:#F59E0B;--warnb:#FEF3C7;
  --c:#FF6B35;--r:20px;
  --sh:0 4px 0 rgba(30,41,59,.07),0 12px 28px -14px rgba(30,41,59,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:700}
body{background-image:radial-gradient(circle at 10% 0%,#FFE8D2 0,transparent 40%),radial-gradient(circle at 100% 30%,#E0F2FE 0,transparent 35%);background-attachment:fixed;min-height:100vh}
h1,h2,h3,h4,.bal{font-family:"Baloo 2",Nunito,sans-serif;margin:0;line-height:1.1}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{max-width:1000px;margin:0 auto;padding:14px 14px 120px}
#drag-layer{position:fixed;inset:0;pointer-events:none;z-index:999}

/* ---------- HOME ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#FF6B35,#F59E0B);display:grid;place-items:center;font-size:24px;box-shadow:var(--sh)}
.brand b{font-family:"Baloo 2";font-size:22px;display:block;line-height:1}
.brand small{color:var(--mut);font-size:12px}
.pills{display:flex;gap:6px}
.pill{background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;box-shadow:var(--sh);white-space:nowrap}
.rail{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{background:#fff;border-radius:999px;padding:9px 16px;font-size:15px;white-space:nowrap;box-shadow:var(--sh);transition:.15s}
.chip.on{background:var(--ink);color:#fff}
.chip.sm{padding:6px 13px;font-size:13px;box-shadow:none;border:2px solid var(--line)}
.chip.sm.on{border-color:var(--ink)}
.hero{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#1E293B,#334155);color:#fff;border-radius:24px;padding:16px 18px;margin:6px 0 16px;box-shadow:var(--sh)}
.hero .big{font-size:40px}
.hero h2{font-size:22px}
.hero p{margin:2px 0 8px;color:#CBD5E1;font-size:13px}
.meter{height:10px;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#FACC15,#FB923C);border-radius:9px;transition:width .6s}
.hero .go{margin-left:auto;background:#FACC15;color:#1E293B;border-radius:14px;padding:10px 14px;font-size:14px;white-space:nowrap;box-shadow:0 4px 0 #CA8A04}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.gcard{background:#fff;border-radius:var(--r);padding:14px;text-align:left;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .15s;border-top:6px solid var(--c)}
.gcard:hover{transform:translateY(-3px)}
.gcard:active{transform:scale(.97)}
.gc-top{display:flex;justify-content:space-between;align-items:flex-start}
.gc-ico{font-size:40px;line-height:1}
.gc-type{font-size:11px;background:color-mix(in srgb,var(--c) 14%,#fff);color:color-mix(in srgb,var(--c) 70%,#000);padding:4px 8px;border-radius:999px}
.gc-title{font-family:"Baloo 2";font-size:18px;margin-top:10px;line-height:1.1}
.gc-ch{font-size:12px;color:var(--mut);margin-top:3px}
.gc-stars{margin-top:8px;font-size:16px;letter-spacing:2px;color:#E2E8F0}
.gc-stars .on{color:#FACC15}
.empty{text-align:center;color:var(--mut);padding:40px}

/* ---------- GAME SHELL ---------- */
.ghead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.x{width:42px;height:42px;border-radius:14px;background:#fff;box-shadow:var(--sh);font-size:18px;flex:none}
.gtitle{flex:1;min-width:0}
.gtitle b{font-family:"Baloo 2";font-size:19px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtitle small{font-size:12px;color:var(--mut)}
.gscore{display:flex;gap:6px;align-items:center}
.combo{background:#FFEDD5;color:#C2410C;border-radius:999px;padding:6px 10px;font-size:13px;opacity:0;transform:scale(.6);transition:.2s}
.combo.on{opacity:1;transform:scale(1)}
.pts{background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;box-shadow:var(--sh)}
.bar{height:10px;background:#fff;border-radius:9px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.08);margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 60%,#FACC15));border-radius:9px;transition:width .4s}
.stage{animation:rise .35s ease}
.gfoot{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);display:flex;justify-content:center;z-index:50;pointer-events:none}
.gfoot>*{pointer-events:auto}
.btn{background:var(--c);color:#fff;border-radius:18px;padding:14px 28px;font-size:18px;font-family:"Baloo 2";box-shadow:0 5px 0 color-mix(in srgb,var(--c) 65%,#000);min-width:200px;transition:.1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 65%,#000)}
.btn:disabled{background:#CBD5E1;box-shadow:0 5px 0 #94A3B8;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #E2E8F0}
.rhead{display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--r);padding:10px 14px;box-shadow:var(--sh);margin-bottom:14px}
.rh-ico{font-size:34px;line-height:1}
.rhead b{font-family:"Baloo 2";font-size:20px;display:block;line-height:1.05}
.rhead small{color:var(--mut);font-size:13px}

/* items */
.dg{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;transition:transform .15s,box-shadow .15s,opacity .15s}
.dg.dragging{opacity:.25}
.dg.sel{outline:4px solid var(--c);transform:scale(1.08)}
.drag-ghost{position:fixed;left:0;top:0;margin:0;opacity:.95;box-shadow:0 18px 30px -8px rgba(0,0,0,.35)!important;transition:none!important;z-index:1000}
.em{font-size:34px;line-height:1;display:block}
.nm{font-size:11px;display:block;margin-top:3px;line-height:1.1}
.tx{font-family:"Baloo 2";font-size:22px;display:block;line-height:1.15}
.art svg{width:64px;height:64px;display:block;margin:auto}
.pic{width:52px;height:52px;object-fit:cover;border-radius:10px;display:block;margin:auto}
[data-zone].hover{outline:4px dashed var(--c);outline-offset:4px}
[data-zone].armed{animation:pulse 1s infinite}

/* PLATTER */
.plate-wrap{display:flex;justify-content:center;margin:4px 0 16px}
.plate{width:min(78vw,320px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 58%,#F8FAFC 59%,#fff 66%,#E2E8F0 67%,#fff 70%);box-shadow:0 10px 0 #E2E8F0,0 22px 40px -12px rgba(30,41,59,.35);display:grid;place-items:center;position:relative}
.plate-in{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:4px;width:74%;height:74%}
.plate-hint{position:absolute;color:#CBD5E1;font-size:14px;pointer-events:none}
.plate.has .plate-hint{display:none}
.plate .food{width:58px;height:62px;box-shadow:none;background:transparent}
.plate .food .em{font-size:30px}
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:90px;padding:10px;border-radius:var(--r);background:rgba(255,255,255,.55);border:2px dashed var(--line)}
.food{width:74px;height:80px;background:#fff;border-radius:16px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px}
.food.ok,.chip-it.ok{background:var(--okb)!important;outline:3px solid var(--ok)}
.food.bad{background:var(--badb)!important;outline:3px solid var(--bad);animation:shake .4s}
.food.missed{background:var(--warnb)!important;outline:3px dashed var(--warn);animation:bob 1s infinite}

/* BINS */
.deck{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 18px;min-height:178px}
.slot{min-height:150px;display:grid;place-items:center}
.card{min-width:150px;min-height:150px;max-width:92vw;background:#fff;border-radius:24px;box-shadow:0 8px 0 #E2E8F0,0 20px 40px -14px rgba(30,41,59,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px 18px}
.card .em{font-size:66px}
.card .nm{font-size:15px;margin-top:8px;max-width:220px}
.card .tx{font-size:26px}
.card .art svg{width:110px;height:110px}
.card.enter{animation:deal .35s ease}
.card.gone{transform:scale(.2) translateY(120px);opacity:0;transition:.35s}
.card.wiggle{animation:wig .4s}
.left{font-size:12px;color:var(--mut)}
.bins{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
.bin{background:#fff;border-radius:22px;padding:12px 8px 10px;text-align:center;box-shadow:var(--sh);border:3px solid transparent;cursor:pointer;transition:.15s;min-height:132px;display:flex;flex-direction:column;align-items:center}
.bin:active{transform:scale(.97)}
.bin-ico{font-size:30px;line-height:1;margin-bottom:4px}
.bin-ico svg{width:34px;height:34px}
.bin b{font-family:"Baloo 2";font-size:16px;line-height:1.05}
.bin small{font-size:11px;color:var(--mut);margin-top:2px;line-height:1.15}
.pile{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:auto;padding-top:6px;min-height:22px}
.mini{font-size:16px;animation:popin .3s}
.mini svg{width:18px;height:18px}
.mini.fix{opacity:.55}
.mini.t{font-size:10px;background:#F1F5F9;border-radius:6px;padding:1px 4px}
.bin.flash-ok{border-color:var(--ok);background:var(--okb)}
.bin.flash-bad{border-color:var(--bad);background:var(--badb);animation:shake .4s}

/* SEQUENCE */
.chain{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:14px}
.arr{color:#CBD5E1;font-size:18px;transform:rotate(90deg);line-height:1}
.sl{display:flex;align-items:center;gap:10px;width:min(100%,380px);background:rgba(255,255,255,.6);border:2.5px dashed #E2D5C3;border-radius:18px;padding:6px 10px;min-height:64px;transition:.15s;position:relative}
.sl.filled{border-style:solid;border-color:#E2E8F0;background:#fff}
.sl.ok{border-color:var(--ok);background:var(--okb)}
.sl.bad{border-color:var(--bad);background:var(--badb);animation:shake .4s}
.no{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.hold{flex:1;min-height:48px;display:flex;align-items:center}
.sub{position:absolute;right:12px;font-size:11px;color:var(--ok);max-width:40%;text-align:right}
.chip-it{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:8px 12px;box-shadow:var(--sh)}
.chip-it .em{font-size:28px}
.chip-it .nm{font-size:14px;margin:0;text-align:left}
.hold .chip-it{box-shadow:none;background:transparent;padding:4px}
.pool{gap:8px}
@media (min-width:760px){
  .chain{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:6px}
  .arr{transform:none;align-self:center}
  .sl{width:auto;min-width:130px;flex-direction:column;padding:8px 10px 18px;min-height:110px}
  .hold{justify-content:center}
  .hold .chip-it{flex-direction:column;gap:2px;text-align:center}
  .hold .chip-it .nm{text-align:center}
  .sub{position:absolute;bottom:3px;left:0;right:0;text-align:center;max-width:none}
}

/* LABEL */
.diagram{position:relative;max-width:560px;margin:0 auto 18px;background:#fff;border-radius:22px;padding:10px;box-shadow:var(--sh)}
.diagram svg{display:block;width:100%;height:auto;border-radius:14px}
.pin{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;display:grid;place-items:center;border-radius:50%}
.diagram .pinbox{position:absolute;inset:10px}
.dot{position:relative;z-index:5;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pin.filled .dot{background:var(--c)}
.pin.ok .dot{background:var(--ok)}
.pin.bad .dot{background:var(--bad);animation:shake .4s}
.pl{position:absolute;top:36px;left:50%;transform:translateX(-50%);z-index:2;pointer-events:none}
.pin.L .pl{left:4px;transform:none}
.pin.R .pl{left:auto;right:4px;transform:none}
.pl .lab{font-size:11px;padding:4px 8px;white-space:nowrap}
.lab{background:#fff;border-radius:12px;padding:9px 13px;font-size:14px;box-shadow:var(--sh);border:2px solid #E2E8F0}
.pin.ok .lab{background:var(--okb);border-color:var(--ok)}
.pin.bad .lab{background:var(--badb);border-color:var(--bad)}

/* PAIRS */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px;margin:0 auto;perspective:900px}
@media (min-width:640px){.mem{grid-template-columns:repeat(4,1fr)}}
.mc{aspect-ratio:1/1.05}
.mc-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.open .mc-in,.mc.done .mc-in{transform:rotateY(180deg)}
.mc-back,.mc-front{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;box-shadow:var(--sh)}
.mc-back{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#FACC15));color:#fff;font-size:30px;font-family:"Baloo 2"}
.mc-front{background:#fff;transform:rotateY(180deg);text-align:center}
.mc-front.s1{background:#F8FAFC}
.mc-front .em{font-size:34px}
.mc-front .nm{font-size:12px}
.mc.done .mc-front{background:var(--okb);outline:3px solid var(--ok)}
.mc.nope .mc-front{background:var(--badb)}

/* ODD */
.odd{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:460px;margin:0 auto}
.ot{background:#fff;border-radius:24px;aspect-ratio:1;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.15s}
.ot .em{font-size:64px}
.ot .nm{font-size:15px;margin-top:6px}
.ot:active{transform:scale(.96)}
.ot.ok{background:var(--okb);outline:4px solid var(--ok);animation:popin .35s}
.ot.bad{background:var(--badb);outline:4px solid var(--bad);animation:shake .4s}
.ot.dim{opacity:.4}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:200;padding:16px;animation:fade .2s}
.ccard,.result{background:#fff;border-radius:28px;padding:22px 20px;max-width:420px;width:100%;text-align:center;animation:deal .35s ease;max-height:92vh;overflow:auto}
.cc-ico{font-size:58px;line-height:1}
.ccard h3{font-size:26px;margin:6px 0 4px}
.ccard p{margin:0 0 12px;color:#475569;font-size:16px}
.cc-em{font-size:30px;letter-spacing:4px;margin-bottom:12px;line-height:1.3}
.fixes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 14px}
.fix{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--badb);color:#991B1B}
.fix.m{background:var(--warnb);color:#92400E}
.fnlist{text-align:left;margin:0 0 14px;display:grid;gap:6px}
.fn{display:flex;gap:10px;align-items:center;background:#F8FAFC;border-radius:12px;padding:8px 10px;font-size:14px}
.fn b{font-family:"Baloo 2";font-size:15px}
.fn .e{font-size:22px}
.r-stars{font-size:54px;letter-spacing:6px;color:#E2E8F0;line-height:1}
.r-stars span.on{color:#FACC15;display:inline-block;animation:starpop .5s both}
.result h2{font-size:30px;margin:6px 0 12px}
.r-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.r-stats div{background:#F8FAFC;border-radius:14px;padding:8px}
.r-stats b{font-family:"Baloo 2";font-size:22px;display:block}
.r-stats small{font-size:11px;color:var(--mut)}
.r-ideas{text-align:left;background:#FFFBEB;border-radius:18px;padding:12px;margin-bottom:16px}
.r-ideas h4{font-size:16px;margin-bottom:6px}
.idea{display:flex;gap:10px;align-items:center;font-size:14px;padding:4px 0}
.idea span{font-size:22px;width:28px;text-align:center}
.r-btns{display:flex;gap:10px;justify-content:center}
.r-btns .btn{min-width:0;flex:1;padding:12px 10px;font-size:17px}
.link{margin-top:12px;color:var(--mut);font-size:14px;text-decoration:underline}

.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:16px;font-size:15px;opacity:0;transition:.25s;z-index:300;max-width:92vw;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:var(--ok)}
.toast.bad{background:var(--bad)}
.cf{position:fixed;top:-12px;width:10px;height:14px;z-index:400;pointer-events:none;animation:fall linear forwards;border-radius:2px}

@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes deal{from{opacity:0;transform:scale(.85) translateY(20px)}}
@keyframes popin{from{transform:scale(0)}60%{transform:scale(1.25)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes wig{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 30%,transparent)}}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3)}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- v2: chapters, search ---------- */
.search{width:100%;padding:12px 16px;border-radius:16px;border:2px solid var(--line);font:inherit;font-size:15px;background:#fff;margin:2px 0 14px;outline:none}
.search:focus{border-color:var(--ink)}
.chap{background:#fff;border-radius:22px;box-shadow:var(--sh);margin-bottom:12px;overflow:hidden;border-left:6px solid var(--c)}
.chap-h{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.chap-no{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--c) 15%,#fff);color:color-mix(in srgb,var(--c) 70%,#000);display:grid;place-items:center;font-family:"Baloo 2";font-size:18px;flex:none}
.chap-t{flex:1;min-width:0}
.chap-t b{font-family:"Baloo 2";font-size:17px;display:block;line-height:1.15}
.chap-t small{color:var(--mut);font-size:12px}
.chap-meter{display:block;height:6px;background:#F1F5F9;border-radius:6px;margin-top:6px;overflow:hidden}
.chap-meter i{display:block;height:100%;background:var(--c);border-radius:6px}
.chev{transition:.2s;color:var(--mut);font-size:22px}
.chap.open .chev{transform:rotate(90deg)}
.chap-body{display:none;padding:0 12px 14px}
.chap.open .chap-body{display:block}
.playall{width:100%;background:var(--c);color:#fff;border-radius:14px;padding:10px;font-family:"Baloo 2";font-size:16px;margin-bottom:10px;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 65%,#000)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{background:#F8FAFC;border-radius:16px;padding:10px;text-align:left;display:flex;gap:10px;align-items:center;border:2px solid transparent;transition:.15s}
.tile:hover{border-color:var(--c)}
.tile .ti{font-size:28px;line-height:1;flex:none}
.tile b{font-size:14px;display:block;line-height:1.15}
.tile small{font-size:11px;color:var(--mut);display:block}
.tile .st{font-size:12px;color:#CBD5E1;letter-spacing:1px}
.st .on{color:#FACC15}
.subj-note{font-size:12px;color:var(--mut);margin:-6px 0 10px}

/* ---------- SWIPE (fact or myth) ---------- */
.swipe-wrap{position:relative;height:290px;display:grid;place-items:center;margin:6px 0 16px}
.scard{position:absolute;width:min(88vw,360px);min-height:230px;background:#fff;border-radius:26px;box-shadow:0 8px 0 #E2E8F0,0 20px 40px -14px rgba(30,41,59,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 22px 22px;touch-action:none;cursor:grab;transition:transform .25s,opacity .25s;user-select:none;-webkit-user-select:none}
.stxt{font-family:"Baloo 2";font-size:22px;line-height:1.25}
.scard.back{transform:scale(.93) translateY(16px);opacity:.55;pointer-events:none}
.scard.back .stxt{filter:blur(3px)}
.stamp{position:absolute;top:14px;font-family:"Baloo 2";font-size:17px;padding:2px 10px;border-radius:10px;border:3px solid;opacity:0;transition:opacity .15s}
.stamp.l{left:14px;color:var(--bad);transform:rotate(-12deg)}
.stamp.r{right:14px;color:var(--ok);transform:rotate(12deg)}
.scard.wrong{animation:shake .4s;background:#FFFBEB}
.fixline{font-size:15px;color:#1E293B;background:#FEF3C7;border-radius:14px;padding:8px 12px;margin-top:14px;line-height:1.3}
.sbtns{display:flex;gap:14px;justify-content:center}
.sb{width:140px;padding:14px;border-radius:20px;font-family:"Baloo 2";font-size:19px;box-shadow:var(--sh);background:#fff;border:3px solid}
.sb.m{color:var(--bad);border-color:#FECACA}
.sb.f{color:var(--ok);border-color:#BBF7D0}
.sb:active{transform:scale(.96)}

/* ---------- GAPS (fill it) ---------- */
.gline{background:#fff;border-radius:24px;padding:24px 18px;box-shadow:var(--sh);font-size:21px;line-height:2.2;text-align:center;font-family:"Baloo 2";margin:4px 0 18px}
.blank{display:inline-block;min-width:84px;border-bottom:3px dashed #CBD5E1;margin:0 4px;padding:0 8px;line-height:1.45;color:var(--c);cursor:pointer;vertical-align:baseline;min-height:1.45em}

.blank.ok{color:var(--ok);border-color:var(--ok);background:var(--okb)}

.wbank{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.word{background:#fff;border-radius:14px;padding:10px 15px;font-size:16px;box-shadow:var(--sh);border:2px solid #E2E8F0;transition:.15s}
.word:active{transform:scale(.95)}

  add(ch){
    const key = `c${ch.cls}-${slug(ch.subject)}-${ch.ch != null ? ch.ch : slug(ch.chapter)}`;
    const c = {cls:ch.cls, subject:ch.subject, ch:ch.ch, chapter:ch.chapter, book:ch.book, icon:ch.icon, key, ids:[]};
    (ch.games || []).forEach((g, k) => {
      try {
        Object.assign(g, {cls:c.cls, subject:c.subject, chapter:c.chapter, ch:c.ch, chKey:key});
        g.id = g.id || `${key}-${k + 1}`;
        normalize(g);
        QR.games.push(g); c.ids.push(g.id);
      } catch(e){ console.warn('QuickRevise: skipped a game in', key, e); }

function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 30); }

/* ---------- compact format → objects ---------- */
const parts = (s, max) => { const p = String(s).split('|').map(x => x.trim()); if (max && p.length > max) throw new Error('too many | in: ' + s); return p; };
const itm = (e, n) => e ? {e, n} : {t:n};
function normalize(g){
  if (g.ideas) g.ideas = g.ideas.map(x => typeof x === 'string' ? parts(x, 2) : x);
  const T = g.type;
  if (T === 'bins'){
    g.bins = g.bins.map(b => { if (typeof b !== 'string') return b; const [id, icon, label, sub] = parts(b, 4); return {id, icon, label, sub}; });
    g.items = g.items.map(s => { if (typeof s !== 'string') return s; const [bin, e, n, tip] = parts(s, 4); return Object.assign(itm(e, n), {bin, tip}); });
    g.items.forEach(it => { if (!g.bins.some(b => b.id === it.bin)) throw new Error('unknown bin ' + it.bin); });
  } else if (T === 'platter'){
    g.tagNames = g.tagNames || g.tags;
    g.items = g.items.map(s => { if (typeof s !== 'string') return s; const [e, n, t, a] = parts(s, 4); return {e, n, tags:t.split(/\s+/), also:a ? a.split(/\s+/) : []}; });
    g.rounds = g.rounds.map(s => { if (typeof s !== 'string') return s; const [tag, icon, label, hint, idea] = parts(s, 5); return {tag, icon, label, hint, idea}; });
  } else if (T === 'sequence'){
    g.items = g.items.map(s => { if (typeof s !== 'string') return s; const [e, n, sub] = parts(s, 3); return Object.assign(itm(e, n), {sub}); });
    if (typeof g.reveal === 'string'){ const [icon, title, text] = parts(g.reveal, 3); g.reveal = {icon, title, text}; }
  } else if (T === 'label'){
    if (typeof g.svg === 'string' && SVGS[g.svg]){ const d = SVGS[g.svg]; g.w = d.w; g.h = d.h; g.svg = d.svg; }
    g.spots = g.spots.map(s => Array.isArray(s) ? {x:s[0], y:s[1], n:s[2], e:s[3], fn:s[4]} : s);
  } else if (T === 'pairs'){
    g.pairs = g.pairs.map(p => p.map(s => { if (typeof s !== 'string') return s; const [e, n] = parts(s, 2); return itm(e, n); }));
  } else if (T === 'odd'){
    g.rounds = g.rounds.map(r => {
      if (!Array.isArray(r)) return r;
      const why = r[r.length - 1], items = r.slice(0, -1);
      const odd = items.findIndex(x => x.trim()[0] === '*');
      if (odd < 0) throw new Error('odd round without *');
      return {items:items.map(x => { const [e, n] = parts(x.replace(/^\s*\*/, ''), 2); return itm(e, n); }), odd, why};
    });
  } else if (T === 'swipe'){
    g.cards = g.cards.map(s => { if (typeof s !== 'string') return s; const [tf, text, fix] = parts(s, 3); return {fact:tf === 'T', text, fix}; });
  } else if (T === 'gaps'){
    g.lines = g.lines.map(s => typeof s === 'string' ? {s} : s);
    g.lines.forEach(l => { if (!/\[.+?\]/.test(l.s)) throw new Error('gap line without [blank]: ' + l.s); });
  } else throw new Error('unknown type ' + T);
  if (!g.icon) g.icon = '🎮';
  return g;
}
})();

      const o = AC.createOscillator(), g = AC.createGain(), s = t + i * .09;
      o.type = k === 'bad' ? 'square' : 'triangle';
      o.frequency.setValueAtTime(f[0], s); o.frequency.exponentialRampToValueAtTime(f[1], s + .14);
      g.gain.setValueAtTime(k === 'bad' ? .05 : .11, s); g.gain.exponentialRampToValueAtTime(.0001, s + .22);
      o.connect(g).connect(AC.destination); o.start(s); o.stop(s + .24);
    });
  } catch(e){}
  if (k === 'bad' && navigator.vibrate) try { navigator.vibrate(40); } catch(e){}
}

/* ---------- toast + confetti ---------- */
let toastT;
function toast(html, kind){
  const t = $('#toast'); t.className = 'toast ' + (kind || ''); t.innerHTML = html;
  requestAnimationFrame(() => t.classList.add('on'));
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400);
}
function confetti(n){
  const cols = ['#FF6B35','#FACC15','#22C55E','#3B82F6','#EC4899','#8B5CF6'];
  for (let i = 0; i < (n || 70); i++){
    const c = h(`<i class="cf"></i>`);
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % cols.length];
    c.style.animationDuration = 1.6 + Math.random() * 1.6 + 's'; c.style.animationDelay = Math.random() * .4 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 3800);
  }
}

/* ---------- item face ---------- */
function face(it, showName){
  const nm = (showName !== false && it.n) ? `<span class="nm">${it.n}</span>` : '';
  if (it.img)  return `<img class="pic" src="${it.img}" alt="${it.n || ''}" draggable="false">${nm}`;
  if (it.html) return `<span class="art">${it.html}</span>${nm}`;
  if (it.t)    return `<span class="tx">${it.t}</span>`;
  return `<span class="em">${it.e || ''}</span>${nm}`;
}
const short = it => (it.e ? it.e + ' ' : '') + (it.n || it.t || '');

/* ---------- drag + tap ---------- */
const Drag = {
  sel:null, locked:false,
  clear(){ if (this.sel) this.sel.classList.remove('sel'); this.sel = null; $$('[data-zone].armed').forEach(z => z.classList.remove('armed')); },
  toggle(el){
    if (this.sel === el) return this.clear();
    this.clear(); this.sel = el; el.classList.add('sel');
    $$('[data-zone]').forEach(z => { if (!z.contains(el)) z.classList.add('armed'); }); sfx('pop');
  },
  item(el, o){
    el.classList.add('dg'); el._o = o; el.tabIndex = 0;
    const tap = () => { if (Drag.locked || el.classList.contains('lock')) return; o.tap ? o.tap(el) : Drag.toggle(el); };
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); tap(); } });
    el.addEventListener('pointerdown', e => {
      if (Drag.locked || el.classList.contains('lock') || (e.button && e.button !== 0)) return;
      e.preventDefault();
      const r = el.getBoundingClientRect(), sx = e.clientX, sy = e.clientY;
      let gh = null, hov = null;
      try { el.setPointerCapture(e.pointerId); } catch(_){}
      const mv = ev => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (!gh && Math.hypot(dx, dy) > 7){
          gh = el.cloneNode(true); gh.classList.add('drag-ghost'); gh.classList.remove('sel');
          gh.style.width = r.width + 'px'; gh.style.height = r.height + 'px';
          layer.appendChild(gh); el.classList.add('dragging'); Drag.clear();
        }
        if (gh){
          gh.style.transform = `translate(${r.left + dx}px,${r.top + dy}px) rotate(3deg) scale(1.08)`;
          const z = zoneAt(ev.clientX, ev.clientY);
          if (z !== hov){ hov && hov.classList.remove('hover'); hov = z; hov && hov.classList.add('hover'); }
        }
      };
      const up = ev => {
        el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
        if (gh){
          gh.remove(); el.classList.remove('dragging'); hov && hov.classList.remove('hover');
          if (ev.type === 'pointerup'){ const z = zoneAt(ev.clientX, ev.clientY); if (z) o.drop(z, el); }
        } else if (ev.type === 'pointerup') tap();
      };
      el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    });
  },
  zone(z){
    if (!(z.tabIndex >= 0)) z.tabIndex = 0;
    const go = e => { if (!Drag.sel || (e.target.closest && e.target.closest('.dg'))) return; const s = Drag.sel; Drag.clear(); s._o.drop(z, s); };
    z.addEventListener('click', go);
    z.addEventListener('keydown', e => { if (e.key === 'Enter') go(e); });
  }
};
function zoneAt(x, y){ const el = document.elementFromPoint(x, y); return el && el.closest('[data-zone]'); }
const pop = el => { try { el.animate([{transform:'scale(.6)'},{transform:'scale(1.15)'},{transform:'scale(1)'}], {duration:260}); } catch(e){} };

const starsHtml = n => [1,2,3].map(k => `<span class="${k <= n ? 'on' : ''}">★</span>`).join('');
const subjectsOf = cls => SUBJ_ORDER.filter(s => QR.chapters.some(c => c.cls === cls && c.subject === s && c.ids.length))
  .concat([...new Set(QR.chapters.filter(c => c.cls === cls && c.ids.length).map(c => c.subject))].filter(s => !SUBJ_ORDER.includes(s)));
const gameById = id => GAMES.find(g => g.id === id);
const starsOf = ids => ids.reduce((a, id) => a + (P.stars[id] || 0), 0);

function tile(g){
  return `<button class="tile" data-id="${g.id}" style="--c:${colorOf(g.subject)}"><span class="ti">${g.icon}</span><span><b>${g.title}</b><small>${TYPES[g.type].icon} ${TYPES[g.type].name}</small><span class="st">${starsHtml(P.stars[g.id] || 0)}</span></span></button>`;
}

function renderHome(){
  Drag.clear(); Drag.locked = false;
  document.documentElement.style.setProperty('--c', '#FF6B35');
  const subs = subjectsOf(S.cls);
  if (!S.subject || !subs.includes(S.subject)) S.subject = (P.subj[S.cls] && subs.includes(P.subj[S.cls])) ? P.subj[S.cls] : subs[0];
  const clsIds = GAMES.filter(g => g.cls === S.cls).map(g => g.id);

  </header>

function renderList(){
  const box = $('#list'); if (!box) return;
  const q = S.q.trim().toLowerCase();

/* =====================================================================
   GAME SHELL
   ===================================================================== */
let keyHandler = null;
function setKeys(fn){ if (keyHandler) document.removeEventListener('keydown', keyHandler); keyHandler = fn; if (fn) document.addEventListener('keydown', fn); }

function openGame(id){
  const g = gameById(id); if (!g) return renderHome();
  setKeys(null); Drag.clear(); Drag.locked = false;
  $$('.overlay').forEach(o => o.remove());
  S.open[g.chKey] = true;
  document.documentElement.style.setProperty('--c', colorOf(g.subject));
  app.innerHTML = `
    <header class="ghead">
      <button class="x" aria-label="Close">✕</button>
      <div class="gtitle"><b>${g.icon} ${g.title}</b><small>Class ${g.cls} · ${g.subject}${g.ch != null ? ' · Ch ' + g.ch : ''} · ${g.chapter}</small></div>
      <div class="gscore"><span class="combo"></span><span class="pts">⭐ 0</span></div>
    </header>
    <div class="bar"><i></i></div>
    <div class="stage"></div>
    <footer class="gfoot"></footer>`;
  window.scrollTo(0, 0);
  $('.x').onclick = () => { setKeys(null); $$('.overlay').forEach(o => o.remove()); renderHome(); };
  const stage = $('.stage'), foot = $('.gfoot');
  const st = {hits:0, miss:0, combo:0, best:0, pts:0, t0:Date.now()};
  const upd = () => {
    $('.pts').textContent = '⭐ ' + st.pts;
    const c = $('.combo'); c.classList.toggle('on', st.combo >= 3); c.textContent = '🔥 x' + st.combo;
  };
  const ctx = {
    st,
    hit(quiet){ st.hits++; st.combo++; st.best = Math.max(st.best, st.combo); st.pts += 10 + Math.min(st.combo, 5) * 2; if (!quiet) sfx('ok'); upd(); },
    miss(w, quiet){ st.miss += (w == null ? 1 : w); st.combo = 0; if (!quiet) sfx('bad'); upd(); },
    progress(i, n){ const b = $('.bar i'); if (b) b.style.width = Math.min(100, i / n * 100) + '%'; },
    tip: toast,
    button(label, fn, disabled){
      foot.innerHTML = ''; if (!label) return;
      const b = h(`<button class="btn">${label}</button>`); b.disabled = !!disabled; b.onclick = fn; foot.appendChild(b);
    },
    concept(c, next){
      const o = h(`<div class="overlay"><div class="ccard">
        <div class="cc-ico">${c.icon || '💡'}</div><h3>${c.title}</h3>${c.text ? `<p>${c.text}</p>` : ''}
        ${c.emojis ? `<div class="cc-em">${c.emojis}</div>` : ''}${c.html || ''}
        <button class="btn">${c.btn || 'Next ▶'}</button></div></div>`);
      document.body.appendChild(o);
      $('.btn', o).onclick = () => { o.remove(); next && next(); };
    },
    finish(){ setKeys(null); finishGame(g, st); }
  };
  ctx.button(null);
  try { ENGINES[g.type](stage, g, ctx); }
  catch(e){ console.error(e); stage.innerHTML = `<div class="empty">This game has a content error. Please tell your teacher. (${g.id})</div>`; }
}

function nextGameOf(g){
  const list = GAMES.filter(x => x.cls === g.cls && x.subject === g.subject);
  return list[(list.indexOf(g) + 1) % list.length];
}

function finishGame(g, st){
  Drag.locked = true;
  const b = $('.bar i'); if (b) b.style.width = '100%';
  const total = st.hits + st.miss, pct = Math.round((total ? st.hits / total : 1) * 100);
  const stars = pct >= 90 ? 3 : pct >= 70 ? 2 : 1;
  const xp = pct + stars * 10 + st.best * 2;
  P.stars[g.id] = Math.max(P.stars[g.id] || 0, stars);
  P.xp = (P.xp || 0) + xp;
  const today = new Date().toISOString().slice(0, 10), yest = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  if (P.lastDay !== today){ P.streak = P.lastDay === yest ? (P.streak || 0) + 1 : 1; P.lastDay = today; }
  save();
  sfx('win'); if (stars >= 2) confetti(stars === 3 ? 110 : 50);

  const payload = {source:'vis-quick-revision', type:'game-complete', gameId:g.id, cls:g.cls, subject:g.subject,
    chapterNo:g.ch, chapter:g.chapter, gameType:g.type, title:g.title, accuracy:pct, stars, xp, hits:st.hits, misses:st.miss,
    bestCombo:st.best, timeSec:Math.round((Date.now() - st.t0) / 1000)};
  try { if (window.parent !== window) window.parent.postMessage(payload, '*'); } catch(e){}
  try { window.VISQuickRevision.onComplete && window.VISQuickRevision.onComplete(payload); } catch(e){}

  const nx = nextGameOf(g);
  const sameCh = nx && nx.chKey === g.chKey;
  const o = h(`<div class="overlay"><div class="result">
    <div class="r-stars">${[1,2,3].map(k => `<span class="${k <= stars ? 'on' : ''}" style="animation-delay:${k * .2}s">★</span>`).join('')}</div>
    <h2>${['', 'Nice try! 💪', 'Great job! 🎉', 'Superstar! 🌟'][stars]}</h2>
    <div class="r-stats"><div><b>${pct}%</b><small>accuracy</small></div><div><b>+${xp}</b><small>XP</small></div><div><b>🔥${st.best}</b><small>best combo</small></div></div>
    ${g.ideas && g.ideas.length ? `<div class="r-ideas"><h4>🧠 Remember</h4>${g.ideas.map(([e, t]) => `<div class="idea"><span>${e}</span>${t}</div>`).join('')}</div>` : ''}
    <div class="r-btns"><button class="btn ghost" data-a="again">↻ Again</button>${nx && nx !== g ? `<button class="btn" data-a="next">${sameCh ? 'Next game ▶' : 'Next chapter ▶'}</button>` : ''}</div>
    <button class="link" data-a="home">All chapters</button>
  </div></div>`);
  document.body.appendChild(o);
  o.addEventListener('click', e => {
    const a = e.target.closest('[data-a]'); if (!a) return;
    o.remove();
    if (a.dataset.a === 'again') openGame(g.id);
    else if (a.dataset.a === 'next') openGame(nx.id);
    else renderHome();
  });
}

/* =====================================================================
   GAME ENGINES
   ===================================================================== */
const ENGINES = {};

/* 1. PLATTER */
ENGINES.platter = (stage, g, ctx) => {
  let r = 0;
  const round = () => {
    Drag.locked = false;
    const R = g.rounds[r]; ctx.progress(r, g.rounds.length);
    const has = (it, tag) => it.tags.includes(tag);
    const pos = shuffle(g.items.filter(i => has(i, R.tag))).slice(0, g.perRoundRight || 5);
    const neg = shuffle(g.items.filter(i => !has(i, R.tag) && !(i.also || []).includes(R.tag))).slice(0, (g.perRound || 12) - pos.length);
    stage.innerHTML = `
      <div class="rhead"><span class="rh-ico">${R.icon}</span><div><b>${R.label}</b><small>${R.hint}</small></div></div>
      <div class="plate-wrap"><div class="plate" data-zone="plate"><div class="plate-in"></div><span class="plate-hint">drag or tap ⬇</span></div></div>
      <div class="tray" data-zone="tray"></div>`;
    const plate = $('.plate', stage), pin = $('.plate-in', stage), tray = $('.tray', stage);
    const refresh = () => { plate.classList.toggle('has', pin.children.length > 0); ctx.button(`${g.serve || 'Serve'} ${R.icon}`, check, pin.children.length === 0); };
    const move = (el, toPlate) => { (toPlate ? pin : tray).appendChild(el); pop(el); sfx('pop'); refresh(); };
    shuffle(pos.concat(neg)).forEach(it => {
      const el = h(`<div class="food">${face(it)}</div>`); el._it = it; tray.appendChild(el);
      Drag.item(el, { drop:(z, el) => move(el, z === plate), tap:el => move(el, el.parentNode !== pin) });
    });
    refresh();
    function check(){
      Drag.locked = true; ctx.button(null);
      const fixes = [];
      $$('.food', stage).forEach(el => {
        const it = el._it, good = has(it, R.tag), on = el.parentNode === pin;
        if (on && good){ el.classList.add('ok'); ctx.hit(true); }
        else if (on && !good){ el.classList.add('bad'); ctx.miss(1, true); fixes.push(`<span class="fix">${short(it)} → ${it.tags.map(t => g.tagNames[t] || t).join(' + ')}</span>`); }
        else if (!on && good){ el.classList.add('missed'); ctx.miss(1, true); fixes.push(`<span class="fix m">${short(it)} was ${g.tagNames[R.tag]} too</span>`); }
      });
      sfx(fixes.length ? 'bad' : 'win'); if (!fixes.length) confetti(40);
      setTimeout(() => ctx.concept({
        icon:R.icon, title:R.label, text:R.idea,
        emojis:g.items.filter(i => has(i, R.tag)).map(i => i.e).join(''),
        html:fixes.length ? `<div class="fixes">${fixes.join('')}</div>` : `<div class="fixes"><span class="fix" style="background:var(--okb);color:#166534">Perfect! ✨</span></div>`,
        btn:r < g.rounds.length - 1 ? 'Next round ▶' : 'Finish 🏁'
      }, () => { r++; r < g.rounds.length ? round() : ctx.finish(); }), 1100);
    }
  };
  round();
};

/* 2. BINS */
ENGINES.bins = (stage, g, ctx) => {
  const items = shuffle(g.items.slice()).slice(0, g.count || g.items.length);
  let i = 0, cur = null, busy = false;
  stage.innerHTML = `
    ${g.prompt ? `<div class="rhead"><span class="rh-ico">${g.icon}</span><div><b>${g.prompt}</b>${g.hint ? `<small>${g.hint}</small>` : ''}</div></div>` : ''}
    <div class="deck"><div class="slot"></div><div class="left"></div></div>
    <div class="bins">${g.bins.map(b => `<div class="bin" data-zone="bin" data-b="${b.id}"><div class="bin-ico">${b.icon || ''}</div><b>${b.label}</b>${b.sub ? `<small>${b.sub}</small>` : ''}<div class="pile"></div></div>`).join('')}</div>`;
  const slot = $('.slot', stage), left = $('.left', stage), bins = $$('.bin', stage);
  const binOf = id => g.bins.find(b => b.id === id);
  bins.forEach(b => b.addEventListener('click', () => place(b)));
  ctx.tip('Drag the card — or tap a bin');
  function next(){
    ctx.progress(i, items.length);
    if (i >= items.length) return setTimeout(() => ctx.finish(), 300);
    const it = items[i];
    cur = h(`<div class="card enter">${face(it, g.showNames !== false)}</div>`); cur._it = it;
    slot.innerHTML = ''; slot.appendChild(cur);
    Drag.item(cur, { drop:z => place(z), tap:el => { el.classList.remove('wiggle'); void el.offsetWidth; el.classList.add('wiggle'); } });
    left.textContent = `${items.length - i} left`; busy = false;
  }
  function place(b){
    if (busy || !cur || !b.classList.contains('bin')) return;
    busy = true;
    const it = cur._it, ok = it.bin === b.dataset.b;
    const right = bins.find(x => x.dataset.b === it.bin);
    const name = it.n || it.t || '';
    if (ok){ ctx.hit(); b.classList.add('flash-ok'); if (it.tip) ctx.tip(`✓ ${it.e ? it.e + ' ' : ''}${name} · ${it.tip}`, 'ok'); }
    else {
      ctx.miss(); b.classList.add('flash-bad'); right.classList.add('flash-ok');
      ctx.tip(`${it.e ? it.e + ' ' : ''}${name} → ${binOf(it.bin).label}${it.tip ? ' · ' + it.tip : ''}`, 'bad');
    }
    cur.classList.add('gone');
    const mini = it.html ? `<span class="mini ${ok ? '' : 'fix'}">${it.html}</span>`
      : it.e ? `<span class="mini ${ok ? '' : 'fix'}">${it.e}</span>` : `<span class="mini t ${ok ? '' : 'fix'}">${it.t}</span>`;
    setTimeout(() => $('.pile', right).insertAdjacentHTML('beforeend', mini), 250);
    setTimeout(() => { bins.forEach(x => x.classList.remove('flash-ok', 'flash-bad')); i++; next(); }, ok ? (it.tip ? 1100 : 520) : 1900);
  }
  next();
};

/* 3. SEQUENCE */
ENGINES.sequence = (stage, g, ctx) => {
  const n = g.items.length; let tries = 0;
  let order = shuffle(g.items.map((it, k) => Object.assign({}, it, {k})));
  while (n > 1 && order.every((it, k) => it.k === k)) order = shuffle(order);
  stage.innerHTML = `
    <div class="rhead"><span class="rh-ico">${g.head || g.icon || '🔗'}</span><div><b>${g.prompt || 'Put in order'}</b><small>${g.hint || 'Tap or drag in order'}</small></div></div>
    <div class="chain">${g.items.map((_, k) => `<div class="sl" data-zone="slot" data-k="${k}"><span class="no">${k + 1}</span><div class="hold"></div><small class="sub"></small></div>`).join('<span class="arr">➜</span>')}</div>
    <div class="tray pool" data-zone="pool"></div>`;
  const slots = $$('.sl', stage), pool = $('.pool', stage), holdOf = s => $('.hold', s);
  const refresh = () => {
    slots.forEach(s => s.classList.toggle('filled', !!holdOf(s).children.length));
    ctx.progress(slots.filter(s => s.classList.contains('ok')).length, n);
    ctx.button('Check ✓', check, slots.some(s => !holdOf(s).children.length));
  };
  const put = (el, z) => {
    if (z.classList.contains('sl')){
      if (z.classList.contains('ok')) return;
      const hold = holdOf(z), old = hold.firstElementChild;
      if (old && old !== el){ const from = el.parentNode; (from.classList.contains('hold') ? from : pool).appendChild(old); }
      hold.appendChild(el);
    } else pool.appendChild(el);
    pop(el); sfx('pop'); refresh();
  };
  order.forEach(it => {
    const el = h(`<div class="chip-it">${face(it)}</div>`); el._it = it; pool.appendChild(el);
    Drag.item(el, { drop:(z, el) => put(el, z), tap:el => {
      if (el.parentNode === pool){ const s = slots.find(s => !holdOf(s).children.length); if (s) put(el, s); } else put(el, pool);
    }});
  });
  refresh();
  function check(){
    tries++; let bad = 0;
    slots.forEach((s, k) => {
      if (s.classList.contains('ok')) return;
      const el = holdOf(s).firstElementChild;
      if (el._it.k === k){ s.classList.add('ok'); el.classList.add('lock'); ctx.hit(true); $('.sub', s).textContent = g.items[k].sub || ''; }
      else { s.classList.add('bad'); ctx.miss(1, true); bad++; }
    });
    refresh();
    if (!bad){
      sfx('win'); confetti(50); ctx.button(null);
      setTimeout(() => ctx.concept({
        icon:g.reveal ? g.reveal.icon : '🔗', title:g.reveal ? g.reveal.title : 'Chain complete!', text:g.reveal ? g.reveal.text : '',
        html:`<div class="fnlist">${g.items.map(it => `<div class="fn"><span class="e">${it.e || ''}</span><div><b>${it.n || it.t}</b>${it.sub ? ` · ${it.sub}` : ''}</div></div>`).join('')}</div>`,
        btn:'Finish 🏁'
      }, ctx.finish), 800);
    } else {
      sfx('bad');
      const fb = slots.findIndex(s => s.classList.contains('bad'));
      ctx.tip(tries >= 2 ? `💡 Step ${fb + 1}: ${short(g.items[fb])}` : `${n - bad}/${n} right · fix the red ones`, tries >= 2 ? '' : 'bad');
      setTimeout(() => {
        slots.filter(s => s.classList.contains('bad')).forEach(s => { s.classList.remove('bad'); const el = holdOf(s).firstElementChild; if (el) pool.appendChild(el); });
        refresh();
      }, 900);
    }
  }
};

/* 4. LABEL */
ENGINES.label = (stage, g, ctx) => {
  const W = g.w || 400, H = g.h || 300, n = g.spots.length; let tries = 0;
  stage.innerHTML = `
    <div class="rhead"><span class="rh-ico">🏷️</span><div><b>Label it</b><small>Drag a name to a number · or tap name → tap number · tap a number to undo</small></div></div>
    <div class="diagram"><svg viewBox="0 0 ${W} ${H}">${g.svg}</svg><div class="pinbox">${g.spots.map((s, k) =>
      `<div class="pin ${s.x / W < .15 ? 'L' : s.x / W > .85 ? 'R' : ''}" data-zone="pin" data-k="${k}" style="left:${s.x / W * 100}%;top:${s.y / H * 100}%"><span class="dot">${k + 1}</span><div class="pl"></div></div>`).join('')}</div></div>
    <div class="tray labels" data-zone="tray"></div>`;
  const pins = $$('.pin', stage), tray = $('.labels', stage), plOf = p => $('.pl', p);
  const refresh = () => {
    pins.forEach(p => p.classList.toggle('filled', !!plOf(p).children.length));
    ctx.progress(pins.filter(p => p.classList.contains('ok')).length, n);
    ctx.button('Check ✓', check, pins.some(p => !plOf(p).children.length));
  };
  const put = (el, z) => {
    if (z.classList.contains('pin')){
      if (z.classList.contains('ok')) return;
      const pl = plOf(z), old = pl.firstElementChild;
      if (old && old !== el){ const from = el.parentNode; (from.classList.contains('pl') ? from : tray).appendChild(old); }
      pl.appendChild(el);
    } else tray.appendChild(el);
    pop(el); sfx('pop'); refresh();
  };
  pins.forEach(p => p.addEventListener('click', () => {
    if (Drag.sel || Drag.locked || p.classList.contains('ok')) return;
    const el = plOf(p).firstElementChild; if (el) put(el, tray);
  }));
  Drag.zone(tray); pins.forEach(Drag.zone);
  shuffle(g.spots.map((s, k) => Object.assign({}, s, {k}))).forEach(s => {
    const el = h(`<div class="lab">${s.n}</div>`); el._it = s; tray.appendChild(el);
    Drag.item(el, {drop:(z, el) => put(el, z)});
  });
  refresh();
  function check(){
    tries++; let bad = 0; Drag.clear();
    pins.forEach((p, k) => {
      if (p.classList.contains('ok')) return;
      const el = plOf(p).firstElementChild;
      if (el._it.k === k){ p.classList.add('ok'); el.classList.add('lock'); ctx.hit(true); }
      else { p.classList.add('bad'); ctx.miss(1, true); bad++; }
    });
    refresh();
    if (!bad){
      sfx('win'); confetti(60); ctx.button(null);
      setTimeout(() => ctx.concept({
        icon:g.icon, title:'What each part does',
        html:`<div class="fnlist">${g.spots.map(s => `<div class="fn"><span class="e">${s.e || '•'}</span><div><b>${s.n}</b>${s.fn ? ' · ' + s.fn : ''}</div></div>`).join('')}</div>`,
        btn:'Finish 🏁'
      }, ctx.finish), 900);
    } else {
      sfx('bad');
      const k = pins.findIndex(p => p.classList.contains('bad'));
      ctx.tip(tries >= 2 ? `💡 ${k + 1} = ${g.spots[k].n}` : `${n - bad}/${n} right · try the red ones again`, tries >= 2 ? '' : 'bad');
      setTimeout(() => {
        pins.filter(p => p.classList.contains('bad')).forEach(p => { p.classList.remove('bad'); const el = plOf(p).firstElementChild; if (el) tray.appendChild(el); });
        refresh();
      }, 900);
    }
  }
};

/* 5. PAIRS */
ENGINES.pairs = (stage, g, ctx) => {
  const cards = shuffle(g.pairs.flatMap((p, k) => [Object.assign({}, p[0], {k, s:0}), Object.assign({}, p[1], {k, s:1})]));
  let open = [], busy = true, done = 0;
  stage.innerHTML = `
    <div class="rhead"><span class="rh-ico">🧠</span><div><b>${g.prompt || 'Match the pairs'}</b><small>Look first 👀 then flip two at a time</small></div></div>
    <div class="mem">${cards.map((c, i) => `<button class="mc open" data-i="${i}"><div class="mc-in"><div class="mc-back">?</div><div class="mc-front s${c.s}">${face(c)}</div></div></button>`).join('')}</div>`;
  const els = $$('.mc', stage);
  ctx.progress(0, g.pairs.length);
  setTimeout(() => { els.forEach(e => e.classList.remove('open')); busy = false; }, Math.min(4500, 1800 + g.pairs.length * 300));
  els.forEach(el => el.onclick = () => {
    if (busy || el.classList.contains('open') || el.classList.contains('done')) return;
    el.classList.add('open'); sfx('pop'); open.push(el);
    if (open.length < 2) return;
    busy = true;
    const [a, b] = open.map(e => cards[+e.dataset.i]);
    if (a.k === b.k){
      setTimeout(() => {
        open.forEach(e => { e.classList.remove('open'); e.classList.add('done'); });
        ctx.hit(); done++; ctx.progress(done, g.pairs.length);
        const A = a.s === 0 ? a : b, B = a.s === 0 ? b : a;
        ctx.tip(`${short(A)} ↔ ${short(B)}`, 'ok');
        open = []; busy = false;
        if (done === g.pairs.length) setTimeout(ctx.finish, 900);
      }, 350);
    } else {
      setTimeout(() => open.forEach(e => e.classList.add('nope')), 300);
      setTimeout(() => { ctx.miss(.5, true); open.forEach(e => e.classList.remove('open', 'nope')); open = []; busy = false; }, 1000);
    }
  });
};

/* 6. ODD ONE OUT */
ENGINES.odd = (stage, g, ctx) => {
  const rounds = shuffle(g.rounds.slice()); let r = 0;
  const show = () => {
    ctx.progress(r, rounds.length);
    if (r >= rounds.length) return ctx.finish();
    const R = rounds[r];
    const items = shuffle(R.items.map((it, i) => Object.assign({}, it, {odd:i === R.odd})));
    stage.innerHTML = `
      <div class="rhead"><span class="rh-ico">🎯</span><div><b>${g.prompt || 'Odd one out'}</b><small>${r + 1} / ${rounds.length} · tap the one that doesn't belong</small></div></div>
      <div class="odd">${items.map((it, i) => `<button class="ot" data-i="${i}">${face(it)}</button>`).join('')}</div>`;
    let lock = false;
    $$('.ot', stage).forEach(b => b.onclick = () => {
      if (lock) return; lock = true;
      const it = items[+b.dataset.i];
      $$('.ot', stage).forEach((x, i) => { if (items[i].odd) x.classList.add('ok'); else if (x !== b) x.classList.add('dim'); });
      if (it.odd){ ctx.hit(); ctx.tip(R.why, 'ok'); } else { b.classList.add('bad'); ctx.miss(); ctx.tip(R.why, 'bad'); }
      setTimeout(() => { r++; show(); }, it.odd ? 1700 : 2600);
    });
  };
  show();
};

/* 7. SWIPE — fact or myth */
ENGINES.swipe = (stage, g, ctx) => {
  const cards = shuffle(g.cards.slice()); let i = 0, busy = false, cur = null;
  stage.innerHTML = `
    <div class="rhead"><span class="rh-ico">👆</span><div><b>Fact or Myth?</b><small>Swipe → fact · ← myth · or tap a button</small></div></div>
    <div class="swipe-wrap"></div>
    <div class="sbtns"><button class="sb m">✗ Myth</button><button class="sb f">✓ Fact</button></div>`;
  const wrap = $('.swipe-wrap', stage);
  $('.sb.m', stage).onclick = () => decide(false);
  $('.sb.f', stage).onclick = () => decide(true);
  setKeys(e => { if (e.key === 'ArrowLeft') decide(false); if (e.key === 'ArrowRight') decide(true); });
  function next(){
    ctx.progress(i, cards.length);
    if (i >= cards.length) return setTimeout(ctx.finish, 300);
    wrap.innerHTML = '';
    if (cards[i + 1]) wrap.appendChild(h(`<div class="scard back"><div class="stxt">${cards[i + 1].text}</div></div>`));
    cur = h(`<div class="scard"><span class="stamp l">MYTH</span><span class="stamp r">FACT</span><div class="stxt">${cards[i].text}</div></div>`);
    wrap.appendChild(cur); bind(cur); busy = false;
  }
  function bind(el){
    let sx = null, dx = 0;
    el.addEventListener('pointerdown', e => { if (busy) return; sx = e.clientX; dx = 0; try { el.setPointerCapture(e.pointerId); } catch(_){} el.style.transition = 'none'; });
    el.addEventListener('pointermove', e => {
      if (sx == null) return; dx = e.clientX - sx;
      el.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
      $('.stamp.r', el).style.opacity = Math.max(0, dx / 100); $('.stamp.l', el).style.opacity = Math.max(0, -dx / 100);
    });
    const end = () => {
      if (sx == null) return; sx = null; el.style.transition = '';
      if (Math.abs(dx) > 90) decide(dx > 0);
      else { el.style.transform = ''; $$('.stamp', el).forEach(s => s.style.opacity = 0); }
    };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  }
  function decide(saysFact){
    if (busy || !cur) return; busy = true;
    const c = cards[i], ok = saysFact === c.fact, el = cur;
    const fly = dir => { el.style.transition = 'transform .4s, opacity .4s'; el.style.transform = `translateX(${dir * 130}%) rotate(${dir * 20}deg)`; el.style.opacity = 0; };
    $$('.stamp', el).forEach(s => s.style.opacity = 0);
    $('.stamp.' + (c.fact ? 'r' : 'l'), el).style.opacity = 1;
    if (ok){
      ctx.hit(); if (c.fix) ctx.tip(`${c.fact ? '✓' : '✗'} ${c.fix}`, 'ok');
      fly(saysFact ? 1 : -1); setTimeout(() => { i++; next(); }, c.fix ? 1000 : 500);
    } else {
      ctx.miss(); el.style.transform = ''; el.classList.add('wrong');
      el.insertAdjacentHTML('beforeend', `<div class="fixline">${c.fact ? '✓ This is a FACT' : '✗ This is a MYTH'}${c.fix ? ' — ' + c.fix : ''}</div>`);
      setTimeout(() => { fly(c.fact ? 1 : -1); setTimeout(() => { i++; next(); }, 400); }, 2600);
    }
  }
  next();
};

/* 8. GAPS — fill the blanks */
ENGINES.gaps = (stage, g, ctx) => {
  const lines = shuffle(g.lines.slice());
  const pool = [...new Set(g.lines.flatMap(l => [...l.s.matchAll(/\[(.+?)\]/g)].map(m => m[1])).concat(g.extra || []))];
  let r = 0;
  const show = () => {
    ctx.progress(r, lines.length);
    if (r >= lines.length) return ctx.finish();
    const L = lines[r], bits = L.s.split(/\[(.+?)\]/);
    const ans = bits.filter((_, i) => i % 2);
    const extra = shuffle(pool.filter(a => !ans.includes(a))).slice(0, Math.max(2, 5 - ans.length));
    const bank = shuffle(ans.concat(extra));
    stage.innerHTML = `
      <div class="rhead"><span class="rh-ico">🧩</span><div><b>Fill it</b><small>${r + 1} / ${lines.length} · tap words · tap a blank to undo</small></div></div>
      <div class="gline">${bits.map((p, i) => i % 2 ? `<span class="blank"></span>` : p).join('')}</div>
      <div class="wbank">${bank.map((w, i) => `<button class="word" data-w="${i}">${w}</button>`).join('')}</div>`;
    const blanks = $$('.blank', stage), words = $$('.word', stage); let tries = 0, done = false;
    const state = () => ctx.button('Check ✓', check, blanks.some(b => b.dataset.w == null));
    words.forEach(w => w.onclick = () => {
      if (done) return;
      const b = blanks.find(b => b.dataset.w == null); if (!b) return;
      b.dataset.w = w.dataset.w; b.textContent = bank[w.dataset.w]; b.classList.add('f'); w.classList.add('used'); sfx('pop'); state();
    });
    blanks.forEach(b => b.onclick = () => {
      if (done || b.dataset.w == null || b.classList.contains('ok')) return;
      words[b.dataset.w].classList.remove('used'); delete b.dataset.w; b.textContent = ''; b.classList.remove('f'); state();
    });
    state();
    function check(){
      tries++; let bad = 0;
      blanks.forEach((b, k) => {
        if (b.classList.contains('ok')) return;
        if (bank[b.dataset.w] === ans[k]){ b.classList.add('ok'); ctx.hit(true); } else { b.classList.add('bad'); ctx.miss(1, true); bad++; }
      });
      if (!bad){ done = true; sfx('ok'); ctx.button(null); setTimeout(() => { r++; show(); }, 1000); return; }
      sfx('bad');
      if (tries >= 2){
        done = true; ctx.button(null);
        blanks.forEach((b, k) => { if (b.classList.contains('bad')){ b.textContent = ans[k]; b.classList.remove('bad'); b.classList.add('shown'); } });
        ctx.tip('💡 Read it once — then move on');
        setTimeout(() => { r++; show(); }, 2400);
      } else setTimeout(() => {
        blanks.forEach(b => { if (b.classList.contains('bad')){ words[b.dataset.w].classList.remove('used'); delete b.dataset.w; b.textContent = ''; b.classList.remove('bad', 'f'); } });
        state();
      }, 800);
    }
  };
  show();
};
