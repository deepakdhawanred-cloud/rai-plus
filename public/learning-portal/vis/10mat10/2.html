<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proof by sliding Q: why OP ⊥ the tangent</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet"><style>:root{color-scheme:light dark;--text-primary:light-dark(#1d1d1b,#ecebe6);--text-secondary:light-dark(#5f5e5a,#b4b2a9);--text-muted:light-dark(#888780,#888780);--bg-neutral:light-dark(#f1efe8,#2c2c2a);--border:light-dark(rgba(0,0,0,.1),rgba(255,255,255,.1));--border-strong:light-dark(rgba(0,0,0,.22),rgba(255,255,255,.22));--radius:8px;--t:var(--text-secondary);--text-danger:light-dark(#a32d2d,#f09595)}
:root[data-mode=light]{color-scheme:light}:root[data-mode=dark]{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:4px 2px 8px;background:transparent;color:var(--text-primary);font:15px/1.6 "Source Sans 3",system-ui,sans-serif}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button,select{font:inherit;font-size:14px;color:var(--text-primary);background:transparent;border:1px solid var(--border-strong);border-radius:var(--radius);padding:6px 12px;cursor:pointer}
button:hover{background:var(--bg-neutral)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #378add;outline-offset:2px}
input[type=range]{accent-color:#3b6d11}

.t{font-size:14px;fill:var(--text-primary)}.ts{font-size:12px;fill:var(--text-secondary)}.th{font-size:14px;font-weight:600;fill:var(--text-primary)}

.c-purple>rect{fill:light-dark(#EEEDFE,#3C3489);stroke:light-dark(#534AB7,#AFA9EC)}.c-purple>text{fill:light-dark(#3C3489,#EEEDFE)}.c-purple>.ts{fill:light-dark(#534AB7,#AFA9EC)}
.c-teal>rect{fill:light-dark(#E1F5EE,#085041);stroke:light-dark(#0F6E56,#5DCAA5)}.c-teal>text{fill:light-dark(#085041,#E1F5EE)}.c-teal>.ts{fill:light-dark(#0F6E56,#5DCAA5)}
.c-green>rect{fill:light-dark(#EAF3DE,#27500A);stroke:light-dark(#3B6D11,#97C459)}.c-green>text{fill:light-dark(#27500A,#EAF3DE)}.c-green>.ts{fill:light-dark(#3B6D11,#97C459)}
.c-coral>rect{fill:light-dark(#FAECE7,#712B13);stroke:light-dark(#993C1D,#F0997B)}.c-coral>text{fill:light-dark(#712B13,#FAECE7)}.c-coral>.ts{fill:light-dark(#993C1D,#F0997B)}
.c-blue>rect{fill:light-dark(#E6F1FB,#0C447C);stroke:light-dark(#185FA5,#85B7EB)}.c-blue>text{fill:light-dark(#0C447C,#E6F1FB)}.c-blue>.ts{fill:light-dark(#185FA5,#85B7EB)}
.c-gray>rect{fill:light-dark(#F1EFE8,#444441);stroke:light-dark(#5F5E5A,#B4B2A9)}.c-gray>text{fill:light-dark(#444441,#F1EFE8)}.c-gray>.ts{fill:light-dark(#5F5E5A,#B4B2A9)}
.c-red>rect{fill:light-dark(#FCEBEB,#791F1F);stroke:light-dark(#A32D2D,#F09595)}.c-red>text{fill:light-dark(#791F1F,#FCEBEB)}.c-red>.ts{fill:light-dark(#A32D2D,#F09595)}

<script>try{const m=new URLSearchParams(location.search).get('t');if(m)document.documentElement.dataset.mode=m}catch(e){}</script></head><body>
<svg id="s" width="100%" viewBox="0 0 680 290" role="img"><title>Proof that the tangent is perpendicular to the radius</title></svg>
<div style="display:flex;gap:12px;align-items:center;font-size:14px;color:var(--text-secondary);margin-top:6px"><label for="q">Slide Q along the tangent</label><input type="range" id="q" min="-220" max="220" step="1" value="130" style="flex:1"></div>
<p id="cap" style="font-size:14px;margin:8px 0 0"></p>
<script>
const R=100,cx=340,cy=110,Py=cy+R;
function draw(){const qx=cx+ +q.value,OQ=Math.hypot(qx-cx,Py-cy);let s='<title>Proof</title>';
 s+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--text-primary)" stroke-width="2"/><line x1="60" y1="${Py}" x2="620" y2="${Py}" stroke="#D85A30" stroke-width="3"/><text class="ts" x="62" y="${Py-8}">X</text><text class="ts" x="608" y="${Py-8}">Y</text>`;
 s+=`<line x1="${cx}" y1="${cy}" x2="${cx}" y2="${Py}" stroke="#185FA5" stroke-width="3"/><path d="M${cx} ${Py-12} h12 v12" fill="none" stroke="#185FA5" stroke-width="1.5"/>`;
 if(Math.abs(qx-cx)>3)s+=`<line x1="${cx}" y1="${cy}" x2="${qx}" y2="${Py}" stroke="#888780" stroke-width="2" stroke-dasharray="6 4"/><circle cx="${qx}" cy="${Py}" r="6" fill="#888780"/><text class="th" x="${qx}" y="${Py+24}" text-anchor="middle">Q</text>`;
 s+=`<circle cx="${cx}" cy="${cy}" r="4" fill="var(--text-primary)"/><text class="th" x="${cx-20}" y="${cy+4}">O</text><circle cx="${cx}" cy="${Py}" r="5" fill="#185FA5"/><text class="th" x="${cx-6}" y="${Py+24}" text-anchor="end">P</text>`;
 document.getElementById('s').innerHTML=s;const r1=(R/20).toFixed(2),r2=(OQ/20).toFixed(2);
 cap.innerHTML=Math.abs(qx-cx)<=3?`Q is at P: OQ = OP = ${r1} cm. Every other position of Q gives a longer OQ.`:`OP = ${r1} cm, OQ = <b>${r2} cm</b>. Q lies outside the circle, so OQ &gt; OP. OP is the shortest distance from O to XY, so <b>OP ⊥ XY</b>.`}
q.oninput=draw;draw();
</script>
