<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Why the area of a circle is πr²</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet"><style>:root{color-scheme:light dark;--text-primary:light-dark(#1d1d1b,#ecebe6);--text-secondary:light-dark(#5f5e5a,#b4b2a9);--text-muted:light-dark(#888780,#888780);--bg-neutral:light-dark(#f1efe8,#2c2c2a);--border:light-dark(rgba(0,0,0,.1),rgba(255,255,255,.1));--border-strong:light-dark(rgba(0,0,0,.22),rgba(255,255,255,.22));--radius:8px;--t:var(--text-secondary);--text-danger:light-dark(#a32d2d,#f09595)}

<svg id="s" width="100%" viewBox="0 0 680 260" role="img"><title>Rearranging sectors to show area = πr²</title></svg>
<div style="display:flex;gap:12px;align-items:center;font-size:14px;color:var(--text-secondary);margin-top:6px"><label for="n">Number of sectors</label><input type="range" id="n" min="4" max="48" step="2" value="8" style="flex:1"><span id="nv" style="font-weight:600;color:var(--text-primary)"></span><button id="go">Rearrange</button></div>
<p style="font-size:14px;color:var(--text-secondary);margin:8px 0 0">Cut a circle into many thin sectors and lay them top-to-tail. The shape becomes nearly a rectangle of length πr (half the circumference) and height r, so its area is πr × r = πr².</p>
<script>
const R=80;let k=0;
function draw(){const n=+document.getElementById('n').value;nv.textContent=n;const da=2*Math.PI/n,w=Math.PI*R/(n/2);let s='<title>Sectors</title>';
 for(let i=0;i<n;i++){const a0=i*da,a1=a0+da;const cx0=130,cy0=130;const up=i%2===0;const col=up?'#ED93B1':'#B5D4F4';
  const ax=cx0+R*Math.cos(a0-Math.PI/2),ay=cy0+R*Math.sin(a0-Math.PI/2),bx=cx0+R*Math.cos(a1-Math.PI/2),by=cy0+R*Math.sin(a1-Math.PI/2);
  const j=Math.floor(i/2),x=330+j*w+(up?0:w/2),apexY=up?70:190,baseY=up?190:70;const L=[[x+w/2,apexY],[x,baseY],[x+w,baseY]];
  const C=[[cx0,cy0],[ax,ay],[bx,by]];const P=C.map((c,q)=>[c[0]+(L[q][0]-c[0])*k,c[1]+(L[q][1]-c[1])*k]);
  s+=`<path d="M${P[0][0]} ${P[0][1]} L${P[1][0]} ${P[1][1]} L${P[2][0]} ${P[2][1]} Z" fill="${col}" stroke="var(--text-primary)" stroke-width=".6"/>`}
 if(k>0.99)s+=`<text class="th" x="${330+Math.PI*R/2}" y="225" text-anchor="middle">length ≈ πr</text><text class="th" x="318" y="134" text-anchor="end">r</text>`;
 document.getElementById('s').innerHTML=s}
function anim(){if(matchMedia('(prefers-reduced-motion: reduce)').matches){k=1;draw();return}k=0;const t0=performance.now();(function f(t){k=Math.min(1,(t-t0)/1600);draw();if(k<1)requestAnimationFrame(f)})(t0)}
document.getElementById('n').oninput=()=>{draw()};go.onclick=anim;draw();
</script>
