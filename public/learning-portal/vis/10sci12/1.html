<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bar magnet field lines and a compass</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet"><style>:root{color-scheme:light dark;--text-primary:light-dark(#1d1d1b,#ecebe6);--text-secondary:light-dark(#5f5e5a,#b4b2a9);--text-muted:light-dark(#888780,#888780);--bg-neutral:light-dark(#f1efe8,#2c2c2a);--border:light-dark(rgba(0,0,0,.1),rgba(255,255,255,.1));--border-strong:light-dark(rgba(0,0,0,.22),rgba(255,255,255,.22));--radius:8px;--t:var(--text-secondary);--text-danger:light-dark(#a32d2d,#f09595)}
:root[data-mode=light]{color-scheme:light}:root[data-mode=dark]{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:4px 2px 8px;background:transparent;color:var(--text-primary);font:15px/1.6 "Source Sans 3",system-ui,sans-serif}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button,select{font:inherit;font-size:14px;color:var(--text-primary);background:transparent;border:1px solid var(--border-strong);border-radius:var(--radius);padding:6px 12px;cursor:pointer}
button:hover{background:var(--bg-neutral)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #378add;outline-offset:2px}
input[type=range]{accent-color:#3b6d11}
svg text{font-family:"Source Sans 3",system-ui,sans-serif}
.t{font-size:14px;fill:var(--text-primary)}.ts{font-size:12px;fill:var(--text-secondary)}.th{font-size:14px;font-weight:600;fill:var(--text-primary)}
.arr{stroke:var(--text-secondary);stroke-width:1.5;fill:none}.leader{stroke:var(--text-muted);stroke-width:.5;stroke-dasharray:3 3;fill:none}
.c-amber>rect{fill:light-dark(#FAEEDA,#633806);stroke:light-dark(#854F0B,#FAC775)}.c-amber>text{fill:light-dark(#633806,#FAEEDA)}.c-amber>.ts{fill:light-dark(#854F0B,#FAC775)}
.c-purple>rect{fill:light-dark(#EEEDFE,#3C3489);stroke:light-dark(#534AB7,#AFA9EC)}.c-purple>text{fill:light-dark(#3C3489,#EEEDFE)}.c-purple>.ts{fill:light-dark(#534AB7,#AFA9EC)}
.c-teal>rect{fill:light-dark(#E1F5EE,#085041);stroke:light-dark(#0F6E56,#5DCAA5)}.c-teal>text{fill:light-dark(#085041,#E1F5EE)}.c-teal>.ts{fill:light-dark(#0F6E56,#5DCAA5)}
.c-green>rect{fill:light-dark(#EAF3DE,#27500A);stroke:light-dark(#3B6D11,#97C459)}.c-green>text{fill:light-dark(#27500A,#EAF3DE)}.c-green>.ts{fill:light-dark(#3B6D11,#97C459)}
.c-coral>rect{fill:light-dark(#FAECE7,#712B13);stroke:light-dark(#993C1D,#F0997B)}.c-coral>text{fill:light-dark(#712B13,#FAECE7)}.c-coral>.ts{fill:light-dark(#993C1D,#F0997B)}
.c-blue>rect{fill:light-dark(#E6F1FB,#0C447C);stroke:light-dark(#185FA5,#85B7EB)}.c-blue>text{fill:light-dark(#0C447C,#E6F1FB)}.c-blue>.ts{fill:light-dark(#185FA5,#85B7EB)}
.c-gray>rect{fill:light-dark(#F1EFE8,#444441);stroke:light-dark(#5F5E5A,#B4B2A9)}.c-gray>text{fill:light-dark(#444441,#F1EFE8)}.c-gray>.ts{fill:light-dark(#5F5E5A,#B4B2A9)}
.c-red>rect{fill:light-dark(#FCEBEB,#791F1F);stroke:light-dark(#A32D2D,#F09595)}.c-red>text{fill:light-dark(#791F1F,#FCEBEB)}.c-red>.ts{fill:light-dark(#A32D2D,#F09595)}
</style>
<script>try{const m=new URLSearchParams(location.search).get('t');if(m)document.documentElement.dataset.mode=m}catch(e){}</script></head><body>
<svg id="s" width="100%" viewBox="0 0 680 340" role="img" style="touch-action:none"><title>Bar magnet field lines with a movable compass</title></svg>
<p style="font-size:13px;color:var(--text-secondary);margin:6px 0 0">Drag the compass anywhere. Its red tip always points along the field line, away from N and towards S.</p>
<script>
const S=document.getElementById('s');const N=[290,170],So=[390,170];
function B(x,y){let bx=0,by=0;[[N,1],[So,-1]].forEach(([p,q])=>{const dx=x-p[0],dy=y-p[1],r=Math.max(12,Math.hypot(dx,dy));bx+=q*dx/r**3;by+=q*dy/r**3});return[bx,by]}
function line(x,y,dir){let d=`M${x.toFixed(1)} ${y.toFixed(1)}`;for(let i=0;i<500;i++){const[bx,by]=B(x,y),m=Math.hypot(bx,by);x+=dir*3*bx/m;y+=dir*3*by/m;if(x<10||x>670||y<10||y>330)break;if(Math.hypot(x-So[0],y-So[1])<14)break;d+=`L${x.toFixed(1)} ${y.toFixed(1)}`}return d}
let bg='';for(let k=0;k<14;k++){const a=k/14*Math.PI*2+.22;bg+=`<path d="${line(N[0]+14*Math.cos(a),N[1]+14*Math.sin(a),1)}" fill="none" stroke="#85B7EB" stroke-width="1.2"/>`}
bg+=`<rect x="270" y="155" width="70" height="30" fill="#E24B4A"/><rect x="340" y="155" width="70" height="30" fill="#378ADD"/><text x="290" y="170" dominant-baseline="central" style="fill:#fff;font-size:16px;font-weight:600">N</text><text x="383" y="170" dominant-baseline="central" style="fill:#fff;font-size:16px;font-weight:600">S</text>`;
let cx=200,cy=70,dr=false;
function draw(){const[bx,by]=B(cx,cy),a=Math.atan2(by,bx)*180/Math.PI;S.innerHTML='<title>Bar magnet field</title>'+bg+`<g transform="translate(${cx} ${cy})" style="cursor:grab"><circle r="22" fill="var(--bg-neutral)" stroke="var(--text-secondary)" stroke-width="1.2"/><g transform="rotate(${a})"><path d="M18 0 L0 -5 L0 5Z" fill="#E24B4A"/><path d="M-18 0 L0 -5 L0 5Z" fill="#888780"/></g></g>`}
function pt(e){const r=S.getBoundingClientRect();return[(e.clientX-r.left)*680/r.width,(e.clientY-r.top)*340/r.height]}
S.onpointerdown=e=>{const[x,y]=pt(e);if(Math.hypot(x-cx,y-cy)<30){dr=true;S.setPointerCapture(e.pointerId)}};S.onpointermove=e=>{if(!dr)return;[cx,cy]=pt(e);cx=Math.max(25,Math.min(655,cx));cy=Math.max(25,Math.min(315,cy));draw()};S.onpointerup=()=>dr=false;draw();
</script>

<script>(function(){function h(){try{parent.postMessage({rpVis:location.pathname,h:document.documentElement.scrollHeight},'*')}catch(e){}}new ResizeObserver(h).observe(document.body);addEventListener('load',h);h()})();</script>
</body></html>
