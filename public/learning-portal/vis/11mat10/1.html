<svg id="s" width="100%" viewBox="0 0 560 300" role="img"><title>Side view of a double cone cut by a plane, and the resulting curve</title></svg>
<div style="display:flex;gap:12px;align-items:center;font-size:14px;color:var(--text-secondary);margin-top:6px"><label for="b">Angle β between plane and axis</label><input type="range" id="b" min="0" max="90" value="60" style="flex:1"><span id="bv" style="font-weight:600;color:var(--text-primary)"></span></div>
<p id="cap" style="font-size:14px;margin:6px 0 0"></p>
<script>
const AL=30*Math.PI/180,VX=150,VY=150;
function draw(){const bd=+b.value,be=bd*Math.PI/180;bv.textContent=bd+'°';let s='<title>Cone section</title>';
 const L=140,dx=L*Math.tan(AL);s+='<path d="M'+(VX-dx)+' '+(VY-L)+' L'+VX+' '+VY+' L'+(VX+dx)+' '+(VY+L)+' M'+(VX+dx)+' '+(VY-L)+' L'+VX+' '+VY+' L'+(VX-dx)+' '+(VY+L)+'" fill="none" stroke="var(--text-primary)" stroke-width="2"/><line x1="'+VX+'" y1="5" x2="'+VX+'" y2="295" stroke="var(--text-secondary)" stroke-dasharray="5 4"/>';
 const cy=VY-70,ux=Math.sin(be),uy=Math.cos(be);s+='<line x1="'+(VX-170*ux)+'" y1="'+(cy+170*uy)+'" x2="'+(VX+170*ux)+'" y2="'+(cy-170*uy)+'" stroke="#b3541e" stroke-width="3"/>';
 s+='<text class="ts" x="'+(VX+8)+'" y="20">axis</text><text class="ts" x="'+(VX+dx-6)+'" y="'+(VY-L+16)+'" text-anchor="end">α = 30°</text>';
 const e=Math.cos(be)/Math.cos(AL);let name,col='#24577a',d='';const CX=430,CY=150;
 if(bd===90){name='Circle';d='M'+(CX+70)+' '+CY+' A70 70 0 1 0 '+(CX-70)+' '+CY+' A70 70 0 1 0 '+(CX+70)+' '+CY}
 else if(Math.abs(e-1)<0.02){name='Parabola';for(let y=-110;y<=110;y+=4){const x=y*y/160;d+=(y===-110?'M':'L')+(CX-60+x)+' '+(CY-y)}}
 else if(e<1){name='Ellipse';const a=95,bb=a*Math.sqrt(1-e*e);for(let t=0;t<=6.3;t+=0.05)d+=(t?'L':'M')+(CX+a*Math.cos(t))+' '+(CY-bb*Math.sin(t))}
 else{name='Hyperbola';const a=35,bb=a*Math.sqrt(e*e-1);let r='',l='';for(let t=-2;t<=2;t+=0.05){const x=a*Math.cosh(t),y=bb*Math.sinh(t);if(Math.abs(y)<130&&x<110){r+=(r?'L':'M')+(CX+x)+' '+(CY-y);l+=(l?'L':'M')+(CX-x)+' '+(CY-y)}}d=r+' '+l}
 s+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="3"/><text class="th" x="'+CX+'" y="290" text-anchor="middle">'+name+'</text>';
 document.getElementById('s').innerHTML=s;
 cap.textContent=name+': '+(bd===90?'β = 90°.':name==='Ellipse'?'α < β < 90°.':name==='Parabola'?'β = α, plane parallel to a generator.':'β < α: the plane cuts both nappes.')+' Eccentricity e = cos β / cos α ≈ '+e.toFixed(2)+'.'}
b.oninput=draw;draw();
</script>
<p style="font-size:12px;color:var(--text-secondary);margin:4px 0 0">Plane shown not passing through the vertex. The formula e = cos β / cos α is a known result (Dandelin spheres) given for interest; it is not in the textbook.</p>

if(/well done|all sorted|all matched|all correct/i.test(t)&&!matchMedia('(prefers-reduced-motion: reduce)').matches){for(let i=0;i<36;i++){const d=document.createElement('i');d.className='qr-cf';d.style.background=cols[i%5];d.style.left=innerWidth/2+'px';d.style.top='40%';document.body.appendChild(d);const a=Math.random()*6.28,v=80+Math.random()*180;d.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v+260}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:1200+Math.random()*600}).onfinish=()=>d.remove()}}}).observe(cap,{childList:true,characterData:true,subtree:true})}})();</script>
