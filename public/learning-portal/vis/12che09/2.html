<script>
let t=0,run=true;const STEPS=[['Aniline in dilute HCl, cooled in ice (0–5 °C).','#f1efe8',0],['Add NaNO₂ solution slowly: benzenediazonium chloride forms (colourless).','#e6f1fb',0],['Pour into cold alkaline phenol solution…','#e6f1fb',1],['…coupling at the para position gives p-hydroxyazobenzene: an orange dye.','#f2a774',1]];
function frame(){const T=t%720,i=Math.min(3,Math.floor(T/180)),f=(T%180)/180;const [cap0,col,two]=STEPS[i];
 let s='<title>Dye</title><rect x="20" y="170" width="200" height="70" rx="10" fill="#d6ebf7" opacity=".7"/><text class="ts" x="120" y="232" text-anchor="middle">ice bath</text>';
 s+='<path d="M80 60 v150 a40 40 0 0 0 80 0 v-150" fill="none" stroke="var(--text-primary)" stroke-width="2.5"/><path d="M82 140 v70 a38 38 0 0 0 76 0 v-70z" fill="'+(i===0?'#f1efe8':'#e6f1fb')+'" opacity=".9"/>';
 if(i===1)s+='<path d="M120 20 v40" stroke="#888" stroke-width="3"/><circle cx="120" cy="'+(60+f*70)+'" r="4" fill="#888"/>';
 if(two){s+='<path d="M340 60 v150 a40 40 0 0 0 80 0 v-150" fill="none" stroke="var(--text-primary)" stroke-width="2.5"/><path d="M342 140 v70 a38 38 0 0 0 76 0 v-70z" fill="'+(i===3?'#e8783a':'#f1efe8')+'" opacity="'+(i===3?0.4+0.6*f:0.9)+'"/>';if(i===2)s+='<path d="M160 90 Q250 '+(40-f*10)+' 340 90" fill="none" stroke="#2b5f7a" stroke-width="3" stroke-dasharray="6 4"/>'}
 s+='<text class="ts" x="120" y="50" text-anchor="middle">'+(i===0?'C₆H₅NH₂':'C₆H₅N₂⁺Cl⁻')+'</text>'+(two?'<text class="ts" x="380" y="50" text-anchor="middle">'+(i===3?'azo dye':'phenol + NaOH')+'</text>':'');
 document.getElementById('s').innerHTML=s;cap.textContent=cap0;if(run)t++;requestAnimationFrame(frame)}
pb.onclick=()=>{run=!run;pb.textContent=run?'Pause':'Play'};frame();
</script>
