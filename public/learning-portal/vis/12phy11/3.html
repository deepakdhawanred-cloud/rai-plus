<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet"><style>:root{color-scheme:light dark;--text-primary:light-dark(#1d1d1b,#ecebe6);--text-secondary:light-dark(#5f5e5a,#b4b2a9);--text-muted:light-dark(#888780,#888780);--bg-neutral:light-dark(#f1efe8,#2c2c2a);--border:light-dark(rgba(0,0,0,.1),rgba(255,255,255,.1));--border-strong:light-dark(rgba(0,0,0,.22),rgba(255,255,255,.22));--radius:8px;--t:var(--text-secondary);--text-danger:light-dark(#a32d2d,#f09595)}

*{box-sizing:border-box}

svg text{font-family:"Source Sans 3",system-ui,sans-serif}
.t{font-size:14px;fill:var(--text-primary)}.ts{font-size:12px;fill:var(--text-secondary)}.th{font-size:14px;font-weight:600;fill:var(--text-primary)}

.c-purple>rect{fill:light-dark(#EEEDFE,#3C3489);stroke:light-dark(#534AB7,#AFA9EC)}.c-purple>text{fill:light-dark(#3C3489,#EEEDFE)}.c-purple>.ts{fill:light-dark(#534AB7,#AFA9EC)}
.c-teal>rect{fill:light-dark(#E1F5EE,#085041);stroke:light-dark(#0F6E56,#5DCAA5)}.c-teal>text{fill:light-dark(#085041,#E1F5EE)}.c-teal>.ts{fill:light-dark(#0F6E56,#5DCAA5)}
.c-green>rect{fill:light-dark(#EAF3DE,#27500A);stroke:light-dark(#3B6D11,#97C459)}.c-green>text{fill:light-dark(#27500A,#EAF3DE)}.c-green>.ts{fill:light-dark(#3B6D11,#97C459)}
.c-coral>rect{fill:light-dark(#FAECE7,#712B13);stroke:light-dark(#993C1D,#F0997B)}.c-coral>text{fill:light-dark(#712B13,#FAECE7)}.c-coral>.ts{fill:light-dark(#993C1D,#F0997B)}

.c-red>rect{fill:light-dark(#FCEBEB,#791F1F);stroke:light-dark(#A32D2D,#F09595)}.c-red>text{fill:light-dark(#791F1F,#FCEBEB)}.c-red>.ts{fill:light-dark(#A32D2D,#F09595)}
/* ---- Quick Revise look ---- */
:root{--c:#FF6B35;--card:light-dark(#fff,#1E293B);--sh:0 3px 0 light-dark(#E2E8F0,#0B1220),0 10px 20px -14px rgba(30,41,59,.35)}
body{font-family:Nunito,system-ui,sans-serif;font-weight:600}
body>p:first-child,p{line-height:1.5}
button,select{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:700;font-size:15px;border:0;border-radius:14px;padding:8px 14px;background:var(--card);box-shadow:var(--sh);transition:transform .1s,box-shadow .1s,background .15s}
button:hover{background:color-mix(in srgb,var(--c) 10%,var(--card));transform:translateY(-1px)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 light-dark(#E2E8F0,#0B1220)}
select{border:2px solid light-dark(#F3E3CF,#334155);box-shadow:none}
input[type=range]{accent-color:var(--c)}
#items button{border:2px solid color-mix(in srgb,var(--c) 30%,transparent)}
#bins>button{border:3px dashed color-mix(in srgb,var(--c) 35%,transparent);border-radius:20px;box-shadow:none;background:color-mix(in srgb,var(--c) 5%,var(--card))}
#bins>button b{font-family:"Baloo 2",Nunito,sans-serif;font-size:17px;color:color-mix(in srgb,var(--c) 75%,var(--text-primary))}
#cap{font-family:"Baloo 2",Nunito,sans-serif;font-size:16px!important;border-radius:14px;padding:6px 12px;background:color-mix(in srgb,var(--c) 10%,transparent)}
#cap:empty{padding:0;background:none}
#cap.yes{background:light-dark(#DCFCE7,#12301E);color:light-dark(#166534,#86EFAC);animation:qrPop .35s}
#cap.no{background:light-dark(#FEE2E2,#3A1515);color:light-dark(#991B1B,#FCA5A5);animation:qrShake .4s}
svg#s{display:block;max-width:680px;margin:0 auto;background:var(--card);border-radius:18px;box-shadow:0 0 0 2px light-dark(#F3E3CF,#334155);background-image:radial-gradient(circle,light-dark(rgba(100,116,139,.12),rgba(148,163,184,.12)) 1px,transparent 1.4px);background-size:18px 18px}
#pv,#nx{width:40px;padding:8px 0}#pb{background:var(--c);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 62%,#000)}
svg line,svg path,svg polyline,svg polygon{stroke-linecap:round;stroke-linejoin:round}
.qr-cf{position:fixed;width:9px;height:12px;border-radius:2px;pointer-events:none;z-index:9}
@keyframes qrPop{from{transform:scale(.9)}60%{transform:scale(1.04)}}
@keyframes qrShake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
svg#s+div{justify-content:center;flex-wrap:wrap}

<svg id="s" width="100%" viewBox="0 0 680 200" role="img"><title>Photon energy and momentum across the spectrum</title></svg>
<div style="display:flex;gap:12px;align-items:center;font-size:14px;color:var(--text-secondary)"><label for="l">Wavelength</label><input type="range" id="l" min="100" max="1500" step="10" value="550" style="flex:1"></div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px" id="k"></div>
<script>
function col(l){if(l<380)return '#8a5cc6';if(l<450)return '#6a4bd6';if(l<495)return '#3a7fd6';if(l<570)return '#3aa65a';if(l<590)return '#d9c23a';if(l<620)return '#e08a2a';if(l<=750)return '#d6402a';return '#888780'}
function draw(){const L=+l.value,E=1240/L,p=6.626e-34/(L*1e-9),nu=3e8/(L*1e-9);let s='<title>Photon</title>';
 let d='';for(let x=0;x<=640;x+=2)d+=(x?'L':'M')+(20+x)+' '+(90+40*Math.sin(x/(L/12)*2*Math.PI/10));s+=`<path d="${d}" fill="none" stroke="${col(L)}" stroke-width="3"/>`;
 s+=`<text class="ts" x="20" y="170">${L<380?'ultraviolet':L<=750?'visible':'infrared'}: wave drawn with its wavelength to relative scale</text>`;document.getElementById('s').innerHTML=s;
 const box=(a,b)=>`<div style="background:var(--bg-neutral);border-radius:var(--radius);padding:10px"><div style="font-size:13px;color:var(--text-secondary)">${a}</div><div style="font-size:19px;font-weight:600">${b}</div></div>`;
 const sci=x=>{const[m,e]=x.toExponential(2).split('e');return m+' × 10'+e.replace('+','').replace('-','⁻').replace(/\d/g,d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d])};
 k.innerHTML=box('Wavelength',L+' nm')+box('Frequency',sci(nu)+' Hz')+box('Photon energy E = hc/λ',E.toFixed(2)+' eV')+box('Momentum p = h/λ',sci(p)+' kg m/s')}
l.oninput=draw;draw();
</script>

<script>(function(){try{const c=parent.getComputedStyle(parent.document.documentElement).getPropertyValue('--c').trim();if(c)document.documentElement.style.setProperty('--c',c)}catch(e){}
const cap=document.getElementById('cap');if(cap){const cols=['#FF6B35','#FACC15','#16A34A','#6366F1','#EC4899'];let last='';new MutationObserver(()=>{const t=cap.textContent;if(t===last)return;last=t;cap.classList.toggle('yes',/^(Yes|Correct|Right)/i.test(t));cap.classList.toggle('no',/^(Not quite|Try again|No)/i.test(t));
if(/well done|all sorted|all matched|all correct/i.test(t)&&!matchMedia('(prefers-reduced-motion: reduce)').matches){for(let i=0;i<36;i++){const d=document.createElement('i');d.className='qr-cf';d.style.background=cols[i%5];d.style.left=innerWidth/2+'px';d.style.top='40%';document.body.appendChild(d);const a=Math.random()*6.28,v=80+Math.random()*180;d.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v+260}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:1200+Math.random()*600}).onfinish=()=>d.remove()}}}).observe(cap,{childList:true,characterData:true,subtree:true})}})();</script>
