/* ---- Quick Revise look ---- */
:root{--c:#FF6B35;--card:light-dark(#fff,#1E293B);--sh:0 3px 0 light-dark(#E2E8F0,#0B1220),0 10px 20px -14px rgba(30,41,59,.35)}

<svg id="s" width="100%" viewBox="0 0 560 280" role="img"><title>Compass needle</title></svg>
<div style="display:flex;gap:8px;margin-top:6px;align-items:center"><button id="pv">◀</button><button id="pb">Pause</button><button id="nx">▶</button><span id="cap" style="font-size:14px"></span></div>
<script>
const ST=["A compass needle is free to turn.", "Disturbed, it swings past north…", "…and back the other way…", "The swings get smaller…", "…and smaller…", "Almost still.", "It rests pointing north–south (red end north)."];let k=0,run=true,tm=null;
function draw(i){const a=[0,40,-30,15,-8,4,0][i],t=['Freely turning needle','Swings past north…','…and back…','settling…','settling…','almost still','Points north–south'][i];return '<circle cx="280" cy="140" r="110" fill="#fafaf6" stroke="currentColor" stroke-width="3"/>'+['N','E','S','W'].map((d,k)=>'<text class="th" x="'+(280+128*Math.sin(k*Math.PI/2))+'" y="'+(146-128*Math.cos(k*Math.PI/2))+'" text-anchor="middle">'+d+'</text>').join('')+'<g transform="rotate('+a+' 280 140)"><path d="M280 45 L294 140 L266 140Z" fill="#c0392b"/><path d="M280 235 L294 140 L266 140Z" fill="#888780"/></g><circle cx="280" cy="140" r="6" fill="currentColor"/>'}
function show(){document.getElementById('s').innerHTML=draw(k);cap.textContent=(k+1)+'/'+ST.length+' · '+ST[k]}
function tick(){if(run){k=(k+1)%ST.length;show()}tm=setTimeout(tick,3200)}
pb.onclick=()=>{run=!run;pb.textContent=run?'Pause':'Play'};nx.onclick=()=>{run=false;pb.textContent='Play';k=Math.min(ST.length-1,k+1);show()};pv.onclick=()=>{run=false;pb.textContent='Play';k=Math.max(0,k-1);show()};
show();tm=setTimeout(tick,3200);
</script>
<script>(function(){try{const c=parent.getComputedStyle(parent.document.documentElement).getPropertyValue('--c').trim();if(c)document.documentElement.style.setProperty('--c',c)}catch(e){}
const cap=document.getElementById('cap');if(cap){const cols=['#FF6B35','#FACC15','#16A34A','#6366F1','#EC4899'];let last='';new MutationObserver(()=>{const t=cap.textContent;if(t===last)return;last=t;cap.classList.toggle('yes',/^(Yes|Correct|Right)/i.test(t));cap.classList.toggle('no',/^(Not quite|Try again|No)/i.test(t));
if(/well done|all sorted|all matched|all correct/i.test(t)&&!matchMedia('(prefers-reduced-motion: reduce)').matches){for(let i=0;i<36;i++){const d=document.createElement('i');d.className='qr-cf';d.style.background=cols[i%5];d.style.left=innerWidth/2+'px';d.style.top='40%';document.body.appendChild(d);const a=Math.random()*6.28,v=80+Math.random()*180;d.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v+260}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:1200+Math.random()*600}).onfinish=()=>d.remove()}}}).observe(cap,{childList:true,characterData:true,subtree:true})}})();</script>
