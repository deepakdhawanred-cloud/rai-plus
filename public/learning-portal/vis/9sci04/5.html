<svg id="s" width="100%" viewBox="0 0 680 250" role="img"><title>Isotopes of chlorine and average atomic mass</title></svg>
<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--text-secondary);margin-top:6px"><label for="p">Share of chlorine-35</label><input type="range" id="p" min="0" max="100" step="5" value="75" style="flex:1;max-width:260px"><span id="pv" style="font-weight:600;color:var(--text-primary)"></span><button id="real">Natural chlorine (3 : 1)</button></div>
<p id="cap" style="font-size:14px;margin:8px 0 0"></p>
<script>
function draw(){const f=+p.value/100;pv.textContent=Math.round(f*100)+'%';let s='<title>Chlorine sample</title>';
 for(let i=0;i<40;i++){const is35=i<Math.round(f*40),x=40+(i%10)*34,y=40+Math.floor(i/10)*40;s+=`<circle cx="${x}" cy="${y}" r="13" fill="${is35?'#97C459':'#3B6D11'}"/><text x="${x}" y="${y+4}" text-anchor="middle" style="font-size:10px;font-weight:600;fill:${is35?'#173404':'#EAF3DE'}">${is35?35:37}</text>`}
 const avg=35*f+37*(1-f);s+=`<text class="th" x="420" y="60">³⁵Cl: 17 p, 18 n</text><text class="th" x="420" y="90">³⁷Cl: 17 p, 20 n</text><text class="t" x="420" y="140">Average = 35 × ${f.toFixed(2)} + 37 × ${(1-f).toFixed(2)}</text><text class="th" x="420" y="175" style="font-size:22px">= ${avg.toFixed(2)} u</text>`;
 s+=`<text class="ts" x="40" y="215">Same element (Z = 17), different neutrons: these are isotopes, with the same chemical properties.</text>`;
 document.getElementById('s').innerHTML=s;cap.textContent=Math.abs(f-.75)<.01?'Natural chlorine is about three parts ³⁵Cl to one part ³⁷Cl, so its atomic mass is 35.5 u, not a whole number.':'Change the mix and the average mass changes too.'}
p.oninput=draw;real.onclick=()=>{p.value=75;draw()};draw();
</script>

const cap=document.getElementById('cap');if(cap){const cols=['#FF6B35','#FACC15','#16A34A','#6366F1','#EC4899'];let last='';new MutationObserver(()=>{const t=cap.textContent;if(t===last)return;last=t;cap.classList.toggle('yes',/^(Yes|Correct|Right)/i.test(t));cap.classList.toggle('no',/^(Not quite|Try again|No)/i.test(t));
