<svg id="s" width="100%" viewBox="0 0 560 290" role="img"><title>Soil nitrogen over seasons with and without a legume</title></svg>
<div style="display:flex;gap:10px;margin-top:6px;align-items:center"><button id="pb">Pause</button><label class="ts"><input type="checkbox" id="lg" checked> Include a legume (moong) in the rotation</label></div>
<p id="cap" style="font-size:14px;margin:6px 0 0"></p>
<script>
let t=0,run=true;
function frame(){const leg=lg.checked;const seq=leg?[['Paddy','kharif',-25],['Wheat','rabi',-25],['Moong','summer',+35]]:[['Paddy','kharif',-25],['Wheat','rabi',-25],['Paddy','kharif',-25]];
 const k=Math.floor((t%540)/90),f=((t%540)%90)/90;let N=100;const hist=[100];for(let i=0;i<6;i++){N=Math.max(5,Math.min(110,N+seq[i%3][2]*(i<k?1:i===k?f:0)));hist.push(N)}
 let s='<title>Rotation</title><line x1="60" y1="250" x2="540" y2="250" stroke="var(--text-secondary)"/><line x1="60" y1="250" x2="60" y2="30" stroke="var(--text-secondary)"/><text class="ts" x="20" y="40">soil N</text>';
 for(let i=0;i<6;i++){const x=80+i*78;const [n,sz]=seq[i%3];const h=hist[i+1]*1.8;s+='<rect x="'+x+'" y="'+(250-h)+'" width="56" height="'+h+'" fill="'+(n==='Moong'?'#4f6b1a':'#c9a227')+'" opacity="'+(i<=k?.8:.15)+'"/><text class="ts" x="'+(x+28)+'" y="268" text-anchor="middle">'+n+'</text><text class="ts" x="'+(x+28)+'" y="284" text-anchor="middle" style="font-size:10px">'+sz+'</text>'}
 document.getElementById('s').innerHTML=s;
 cap.textContent=leg?'Cereals use up nitrogen; the legume (moong) has root nodules with bacteria that fix nitrogen, so soil nitrogen recovers each cycle.':'Without a legume, every crop takes nitrogen out and the soil gets poorer unless more fertiliser is added.';
 if(run)t++;requestAnimationFrame(frame)}
pb.onclick=()=>{run=!run;pb.textContent=run?'Pause':'Play'};lg.onchange=()=>{t=0};frame();
</script>
<p style="font-size:12px;color:var(--text-secondary);margin:4px 0 0">Illustrative bars, not measured values.</p>
