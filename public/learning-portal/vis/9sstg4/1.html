<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Why winds reverse</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet"><style>:root{color-scheme:light dark;--text-primary:light-dark(#1d1d1b,#ecebe6);--text-secondary:light-dark(#5f5e5a,#b4b2a9);--text-muted:light-dark(#888780,#888780);--bg-neutral:light-dark(#f1efe8,#2c2c2a);--border:light-dark(rgba(0,0,0,.1),rgba(255,255,255,.1));--border-strong:light-dark(rgba(0,0,0,.22),rgba(255,255,255,.22));--radius:8px;--t:var(--text-secondary);--text-danger:light-dark(#a32d2d,#f09595)}

*{box-sizing:border-box}
body{margin:0;padding:4px 2px 8px;background:transparent;color:var(--text-primary);font:15px/1.6 "Source Sans 3",system-ui,sans-serif}

.arr{stroke:var(--text-secondary);stroke-width:1.5;fill:none}.leader{stroke:var(--text-muted);stroke-width:.5;stroke-dasharray:3 3;fill:none}

.c-teal>rect{fill:light-dark(#E1F5EE,#085041);stroke:light-dark(#0F6E56,#5DCAA5)}.c-teal>text{fill:light-dark(#085041,#E1F5EE)}.c-teal>.ts{fill:light-dark(#0F6E56,#5DCAA5)}

<svg id="s" width="100%" viewBox="0 0 560 280" role="img"><title>Monsoon mechanism</title></svg>
<div style="display:flex;gap:8px;margin-top:6px;align-items:center"><button id="pv">◀</button><button id="pb">Pause</button><button id="nx">▶</button><span id="cap" style="font-size:14px"></span></div>
<script>
const ST=["Summer: land and sea in the Sun.", "Land heats faster: low pressure over land.", "Moist winds blow from sea to land: rain.", "Winter: land cools faster.", "Now high pressure over land.", "Dry winds blow from land to sea."];let k=0,run=true,tm=null;
function draw(i){const sum=i<3;let s=`<rect x="0" y="0" width="530" height="260" fill="${sum?'#fdf3e7':'#eef4fa'}"/>`;
s+=`<rect x="40" y="170" width="200" height="60" fill="#b8925a"/><text x="140" y="205" font-size="14" text-anchor="middle">Land</text><rect x="290" y="170" width="200" height="60" fill="#7fb3d5"/><text x="390" y="205" font-size="14" text-anchor="middle">Sea</text>`;
const hot=sum?'Land':'Sea';if(i%3>=1)s+=`<text x="${sum?140:390}" y="150" font-size="16" font-weight="700" text-anchor="middle" fill="#b04a1f">warmer → LOW</text><text x="${sum?390:140}" y="150" font-size="16" font-weight="700" text-anchor="middle" fill="#1f5f8b">cooler → HIGH</text>`;
if(i%3===2){const y=120;s+=sum?`<line x1="380" y1="${y}" x2="170" y2="${y}" stroke="#1f5f8b" stroke-width="4"/><path d="M160 ${y} l14 -8 v16z" fill="#1f5f8b"/><text x="265" y="${y-12}" font-size="13" text-anchor="middle">moist sea winds → rain</text>`:`<line x1="150" y1="${y}" x2="360" y2="${y}" stroke="#888" stroke-width="4"/><path d="M370 ${y} l-14 -8 v16z" fill="#888"/><text x="265" y="${y-12}" font-size="13" text-anchor="middle">dry land winds</text>`}
s+=`<text x="265" y="40" font-size="20" font-weight="700" text-anchor="middle">${sum?'Summer (June)':'Winter (January)'}</text>`;return s;}
function show(){document.getElementById('s').innerHTML=draw(k);cap.textContent=(k+1)+'/'+ST.length+' · '+ST[k]}
function tick(){if(run){k=(k+1)%ST.length;show()}tm=setTimeout(tick,3200)}
pb.onclick=()=>{run=!run;pb.textContent=run?'Pause':'Play'};nx.onclick=()=>{run=false;pb.textContent='Play';k=Math.min(ST.length-1,k+1);show()};pv.onclick=()=>{run=false;pb.textContent='Play';k=Math.max(0,k-1);show()};
show();tm=setTimeout(tick,3200);
</script>
